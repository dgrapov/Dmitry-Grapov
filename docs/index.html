document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e engineering, DevOps and enterprise IT for synthetic biology — after leading data science teams at Centene, Bayer and Monsanto, and founding Creative Data Solutions. Off the clock: trail running, mountain biking, and tending an off-grid farm — same patience and feedback loops, grown into food instead of models.\", chips:['Amyris','CDS','Centene','Bayer','Monsanto'], links:[{label:'LinkedIn', url:'https://www.linkedin.com/in/dmitrygrapov/'},{label:'Resume', url:'https://drive.google.com/file/d/0B51AEMfo-fh9M3FmWXVlb05pdm8/view?resourcekey=0-YUui0qQSQvIcYCjw0ls-zw'},{label:'CV', url:'https://drive.google.com/file/d/0B51AEMfo-fh9Z05aM2p6XzFIOFE/view?resourcekey=0-eWLTXJPfdNmCeAK9OWQpQA'},{label:'CDS', url:'https://creative-data.science/'}] },\n    { kicker:'THE HOLLOW // CODE, SCIENCE & PORTFOLIO', title:'Open tools for messy data', body:'Metabolomics, network analysis, and machine learning pipelines grown into open software. Most-starred: MetaMapR and DeviumWeb, each built to make Omics data legible instead of opaque.', chips:['MetaMapR','DeviumWeb','networkly','CTSgetR','TeachingDemos'], links:[{label:'GitHub', url:'https://github.com/dgrapov'},{label:'MetaMapR', url:'http://dgrapov.github.io/MetaMapR/'},{label:'DeviumWeb', url:'http://dgrapov.github.io/DeviumWeb/'},{label:'networkly', url:'http://dgrapov.github.io/networkly'},{label:'Scholar', url:'https://scholar.google.com/citations?user=zfp5U0QAAAAJ&hl=en'}] },\n    { kicker:'SLIME MOLD // TEACHING', title:'Knowledge spreads root to root', body:'Workshops, conference talks, and open tutorials on multivariate analysis, gene ontology, and network biology.', chips:[], links:[{label:'Demos', url:'https://github.com/dgrapov/TeachingDemos'},{label:'Slides', url:'https://www.slideshare.net/dgrapov'},{label:'Video', url:'https://www.youtube.com/user/dgrapov/videos'}] },\n    { kicker:'THE CROW // WRITING & ART', title:\"What doesn't fit in a dataframe\", body:'Field notes on data science, R, and machine learning — across two blogs, old and new — alongside photography and image-making.', chips:[], links:[{label:'CDS Blog', url:'https://creativedatasolutions.github.io/cds.blog/'},{label:'imDEV Blog', url:'https://imdevsoftware.wordpress.com/'},{label:'Flickr', url:'https://www.flickr.com/people/dgrapov/'}] },\n    { kicker:'THE SPRING // CONTACT', title:\"Let's grow something\", body:'Open to collaboration, consulting, and conversations about network graphs or trail routes.', chips:[], links:[{label:'Email', url:'mailto:dmitry@creative-data.solutions'},{label:'LinkedIn', url:'https://www.linkedin.com/in/dmitrygrapov/'},{label:'GitHub', url:'https://github.com/dgrapov'}] },\n  ];\n\n  canvasRef = React.createRef();\n  glitchWrapRef = React.createRef();\n  netCanvasRef = React.createRef();\n  hoverIndex = -1;\n  openIndex = -1;\n  found = new Set();\n  net = null;\n  parallax = { x: 0, y: 0, tx: 0, ty: 0 };\n  lastMicro = 0;\n\n  componentDidMount() { this.setup(); }\n  componentWillUnmount() {\n    if (this.rafId) cancelAnimationFrame(this.rafId);\n    window.removeEventListener('resize', this.onResize);\n    if (this.three) this.three.renderer.dispose();\n  }\n  componentDidUpdate() {\n    if (this.state.openIndex >= 0 && this.netCanvasRef.current && !this.net) this.initNet();\n    if (this.state.openIndex < 0) this.net = null;\n  }\n\n  glitch(ms, micro) {\n    const el = this.glitchWrapRef.current;\n    if (!el) return;\n    el.style.animation = 'none'; void el.offsetWidth;\n    el.style.animation = `${micro ? 'fx-micro' : 'fx-glitch'} ${ms || 280}ms ease-out 1`;\n  }\n\n  // ---------------- organic voxel primitives ----------------\n  column(cx, cz, r, h, tone, taper) {\n    const c = [];\n    for (let y = 0; y < h; y++) {\n      const rr = taper ? Math.max(1, r - (y / h) * taper) : r;\n      const lean = Math.round(Math.sin(y * 0.06) * 0.9);\n      for (let x = -Math.ceil(rr); x <= Math.ceil(rr); x++) for (let z = -Math.ceil(rr); z <= Math.ceil(rr); z++) {\n        const d = Math.hypot(x, z);\n        if (d > rr + 0.4) continue;\n        if (d < rr - 0.9 && Math.random() > 0.18) continue;\n        c.push({ x: cx + x + lean, y, z: cz + z, tone, n: Math.random() });\n      }\n    }\n    return c;\n  }\n  line(from, to, r, tone) {\n    const c = [];\n    const d = [to[0] - from[0], to[1] - from[1], to[2] - from[2]];\n    const len = Math.hypot(d[0], d[1], d[2]), steps = Math.max(2, Math.round(len * 2.4));\n    for (let s = 0; s <= steps; s++) {\n      const t = s / steps;\n      const p = [Math.round(from[0] + d[0] * t), Math.round(from[1] + d[1] * t), Math.round(from[2] + d[2] * t)];\n      for (let ox = -r; ox <= r; ox++) for (let oy = -r; oy <= r; oy++) for (let oz = -r; oz <= r; oz++)\n        if (Math.hypot(ox, oy, oz) <= r + 0.4) c.push({ x: p[0] + ox, y: p[1] + oy, z: p[2] + oz, tone, n: Math.random() });\n    }\n    return c;\n  }\n  // realistic mushroom: tapered curved stem, domed cap with rolled edge, radial gills\n  mushroom(cx, cy, cz, capR, lean) {\n    const c = [];\n    const stemH = Math.round(capR * 1.9);\n    for (let y = 0; y < stemH; y++) {\n      const t = y / stemH;\n      const sr = Math.max(0.6, capR * (0.30 - t * 0.10));\n      const ox = Math.round(Math.sin(t * 1.5) * (lean || 0));\n      for (let x = -Math.ceil(sr); x <= Math.ceil(sr); x++) for (let z = -Math.ceil(sr); z <= Math.ceil(sr); z++) {\n        if (Math.hypot(x, z) > sr + 0.35) continue;\n        c.push({ x: cx + x + ox, y: cy + y, z: cz + z, tone: 'stem', n: Math.random() });\n      }\n    }\n    const base = cy + stemH, cox = Math.round(Math.sin(1.5) * (lean || 0));\n    for (let x = -capR - 1; x <= capR + 1; x++) for (let z = -capR - 1; z <= capR + 1; z++) {\n      const d = Math.hypot(x, z);\n      if (d > capR + 0.6) continue;\n      const dome = Math.round(Math.sqrt(Math.max(0, 1 - (d / (capR + 0.6)) ** 2)) * capR * 0.85);\n      const rolled = d > capR - 0.9;\n      for (let y = 0; y <= dome; y++) {\n        const surface = y === dome;\n        c.push({ x: cx + x + cox, y: base + y + (rolled ? -1 : 0), z: cz + z, tone: surface ? (rolled ? 'capEdge' : 'cap') : 'capIn', n: Math.random() });\n      }\n    }\n    for (let i = 0; i < capR * 6; i++) {\n      const a = (i / (capR * 6)) * Math.PI * 2;\n      for (let rr = 1.4; rr < capR - 0.4; rr += 1) {\n        c.push({ x: cx + cox + Math.round(Math.cos(a) * rr), y: base - 1, z: cz + Math.round(Math.sin(a) * rr), tone: 'gill', n: Math.random() });\n      }\n    }\n    return c;\n  }\n  // fern frond: arched rachis with paired pinnae that shorten toward the tip\n  frond(cx, cy, cz, len, dir, tone) {\n    const c = [];\n    for (let i = 0; i <= len; i++) {\n      const t = i / len;\n      const x = Math.round(dir[0] * i * 0.85), z = Math.round(dir[1] * i * 0.85);\n      const y = Math.round(Math.sin(t * 2.1) * len * 0.55);\n      c.push({ x: cx + x, y: cy + y, z: cz + z, tone, n: Math.random() });\n      const pl = Math.round((1 - t) * len * 0.42);\n      for (let p = 1; p <= pl; p++) {\n        const px = Math.round(-dir[1] * p), pz = Math.round(dir[0] * p);\n        c.push({ x: cx + x + px, y: cy + y - Math.round(p * 0.4), z: cz + z + pz, tone, n: Math.random() });\n        c.push({ x: cx + x - px, y: cy + y - Math.round(p * 0.4), z: cz + z - pz, tone, n: Math.random() });\n      }\n    }\n    return c;\n  }\n  tuft(cx, cz, n, tone) {\n    const c = [];\n    for (let b = 0; b < n; b++) {\n      const a = Math.random() * Math.PI * 2, h = 3 + Math.round(Math.random() * 4);\n      for (let y = 1; y <= h; y++) {\n        const bend = Math.round((y / h) ** 2 * 2.2);\n        c.push({ x: cx + Math.round(Math.cos(a) * bend), y, z: cz + Math.round(Math.sin(a) * bend), tone, n: Math.random() });\n      }\n    }\n    return c;\n  }\n  blob(cx, cy, cz, R, tone, fill) {\n    const c = [], n = Math.ceil(R);\n    for (let x = -n; x <= n; x++) for (let y = -n; y <= n; y++) for (let z = -n; z <= n; z++) {\n      const d = Math.hypot(x, y * 1.1, z);\n      if (d > R) continue;\n      if (d < R - 1.2 && Math.random() > 0.3) continue;\n      if (Math.random() > (fill ?? 0.9)) continue;\n      c.push({ x: cx + x, y: cy + y, z: cz + z, tone, n: Math.random() });\n    }\n    return c;\n  }\n  // slime mold: dendritic random-walk growth spreading over the floor\n  slime(cx, cz, arms, steps, tone, nodeTone) {\n    const c = [];\n    const walk = (x, z, a, len, w) => {\n      for (let s = 0; s < len; s++) {\n        a += (Math.random() - 0.5) * 0.6;\n        x += Math.cos(a) * 1.1; z += Math.sin(a) * 1.1;\n        const rx = Math.round(x), rz = Math.round(z);\n        c.push({ x: cx + rx, y: 1, z: cz + rz, tone, n: Math.random() });\n        if (w > 0) c.push({ x: cx + rx, y: 2, z: cz + rz, tone, n: Math.random() });\n        if (s > 3 && s % 7 === 0) c.push(...this.blob(cx + rx, 2, cz + rz, 1.5, nodeTone, 0.85));\n        if (w > 0 && Math.random() < 0.14) walk(x, z, a + (Math.random() < 0.5 ? 1 : -1) * 0.9, Math.round(len * 0.5), w - 1);\n      }\n    };\n    for (let i = 0; i < arms; i++) walk(0, 0, (i / arms) * Math.PI * 2, steps, 2);\n    c.push(...this.blob(cx, 2, cz, 2.4, nodeTone, 0.9));\n    return c;\n  }\n\n  makeInst(THREE, cells, step, sizeMul, toneColor, opts) {\n    const o = opts || {};\n    const geo = new THREE.BoxGeometry(step * sizeMul, step * sizeMul, step * sizeMul);\n    const mat = o.unlit\n      ? new THREE.MeshBasicMaterial({ transparent: true, opacity: o.opacity ?? 1, side: o.side || THREE.FrontSide })\n      : new THREE.MeshLambertMaterial({ transparent: true, opacity: o.opacity ?? 1, side: o.side || THREE.FrontSide });\n    const inst = new THREE.InstancedMesh(geo, mat, cells.length);\n    const d = new THREE.Object3D();\n    cells.forEach((c, i) => {\n      d.position.set(c.x * step, c.y * step, c.z * step);\n      d.updateMatrix();\n      inst.setMatrixAt(i, d.matrix);\n      inst.setColorAt(i, o.forceColor || toneColor(c));\n    });\n    inst.instanceMatrix.needsUpdate = true;\n    if (inst.instanceColor) inst.instanceColor.needsUpdate = true;\n    inst.frustumCulled = false;\n    return inst;\n  }\n  makeVox(THREE, cells, step, sizeMul, toneColor, opts) {\n    const emissive = { cap: 1, capEdge: 1, gill: 1, water: 1, waterRim: 1, slimeNode: 1, slimeArm: 1, glow: 1, lichen: 1, frogEye: 1, lizardEye: 1, scorpTip: 1 };\n    const g = new THREE.Group();\n    g.parts = [];\n    const lit = cells.filter(c => !emissive[c.tone]), un = cells.filter(c => emissive[c.tone]);\n    if (lit.length) { const m = this.makeInst(THREE, lit, step, sizeMul, toneColor, opts); g.add(m); g.parts.push(m); }\n    if (un.length) { const m = this.makeInst(THREE, un, step, sizeMul, toneColor, { ...(opts || {}), unlit: true }); g.add(m); g.parts.push(m); }\n    return g;\n  }\n\n  // deterministic PRNG so each seed grows a unique but reproducible forest\n  rand(seed) {\n    let a = seed >>> 0;\n    return () => {\n      a = (a + 0x6D2B79F5) >>> 0;\n      let t = Math.imul(a ^ (a >>> 15), 1 | a);\n      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;\n      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;\n    };\n  }\n  frog(cx, cy, cz) {\n    const c = [\n      ...this.blob(0, 0, 0, 2.2, 'frogSkin', 0.98),\n      ...this.blob(-1, -1, 0, 1.6, 'frogSkin', 0.9),\n      { x: 1, y: 2, z: 1, tone: 'frogEye', n: 0.6 }, { x: 1, y: 2, z: -1, tone: 'frogEye', n: 0.4 },\n      { x: 2, y: 1, z: 0, tone: 'frogSkin', n: 0.5 },\n      ...this.line([-1, -1, 2], [1, -2, 3], 0, 'frogSkin'),\n      ...this.line([-1, -1, -2], [1, -2, -3], 0, 'frogSkin'),\n      ...this.line([1, -2, 3], [3, -2, 3], 0, 'frogSkin'),\n      ...this.line([1, -2, -3], [3, -2, -3], 0, 'frogSkin'),\n    ];\n    return c.map(v => ({ ...v, x: v.x + cx, y: v.y + cy, z: v.z + cz }));\n  }\n\n  softSprite(size, inner) {\n    const c = document.createElement('canvas');\n    c.width = c.height = size;\n    const ctx = c.getContext('2d');\n    const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);\n    g.addColorStop(0, `rgba(25  [-4, 1, 0], 0, 'scorp'),\n      ...this.line([-4, 1, 0], [-5, 3, 0], 0, 'scorp'),\n      ...this.line([-5, 3, 0], [-3, 4, 0], 0, 'scorp'),\n      { x: -2, y: 4, z: 0, tone: 'scorpTip', n: 0.5 },\n      ...this.line([3, 0, 1], [5, 0, 2], 0, 'scorp'), ...this.line([3, 0, -1], [5, 0, -2], 0, 'scorp'),\n      ...this.line([0, -1, 2], [2, -1, 3], 0, 'scorp'), ...this.line([0, -1, -2], [2, -1, -3], 0, 'scorp'),\n      ...this.line([-1, -1, 2], [-3, -1, 3], 0, 'scorp'), ...this.line([-1, -1, -2], [-3, -1, -3], 0, 'scorp'),\n    ];\n    const scorpion = new THREE.Group();\n    scorpion.add(this.makeVox(THREE, scorpCells, step, 0.95, toneColor));\n    scene.add(scorpion);\n\n    // snake — segmented body that slithers across the clearing\n    const SEG = 18;\n    const snakeMat = new THREE.MeshLambertMaterial();\n    const snake = new THREE.InstancedMesh(new THREE.BoxGeometry(step * 1.6, step * 1.6, step * 1.6), snakeMat, SEG);\n    snake.frustumCulled = false;\n    const snakeBody = new THREE.Color('#1B4038'), snakeSkin = new THREE.Color('#63A08C');\n    for (let i = 0; i < SEG; i++) snake.setColorAt(i, snakeBody.clone().lerp(i < 2 ? PALE : snakeSkin, i % 2 ? 0.65 : 0.3));\n    if (snake.instanceColor) snake.instanceColor.needsUpdate = true;\n    scene.add(snake);\n    const snakeDummy = new THREE.Object3D();\n    const snakeHead = new THREE.Vector3();\n\n    // faint links from the moving creatures to whatever the scene is currently featuring\n    const linkPos = new Float32Array(18);\n    const linkGeo = new THREE.BufferGeometry();\n    linkGeo.setAttribute('position', new THREE.BufferAttribute(linkPos, 3));\n    const linkMat = new THREE.LineBasicMaterial({ color: PALE, transparent: true, opacity: 0.1 });\n    const links = new THREE.LineSegments(linkGeo, linkMat);\n    links.frustumCulled = false;\n    scene.add(links);\n\n    // travelling bioluminescent pulse that sweeps the forest floor\n    const pulse = new THREE.PointLight(PALE, 0, 16, 2);\n    pulse.position.set city: 0.3, depthWrite: false, blending: THREE.AdditiveBlending })));\n\n    const MAX = 600;\n    const bpos = new Float32Array(MAX * 3);\n    const bcol = new Float32Array(MAX * 3);\n    for (let i = 0; i < MAX; i++) bpos[i * 3 + 1] = 9999;\n    const bgeo = new THREE.BufferGeometry();\n    bgeo.setAttribute('position', new THREE.BufferAttribute(bpos, 3));\n    bgeo.setAttribute('color', new THREE.BufferAttribute(bcol, 3));\n    const bpts = new THREE.Points(bgeo, new THREE.PointsMaterial({ vertexColors: true, size: 0.34, map: new THREE.CanvasTexture(this.softSprite(32, 0.9)), transparent: true, opacity: 0.55, depthWrite: false, blending: THREE.AdditiveBlending }));\n    bpts.frustumCulled = false;\n    scene.add(bpts);\n    this.bursts = [];\n\n    camera.position.set(10, 8.5, 23);\n    camera.lookAt(0, 6, 0);\n    this.three = { THREE, scene, camera, renderer, hotspots, squirrel, spos, sgeo, SP, smpos, smgeo, SM, smmat, shmat, bpos, bgeo, MAX, step };\n\n    this.onResize = this.onResize.bind(this);\n    window.addEventListener('resize', this.onResize);\n    this.onResize();\n    this.bindPointer(canvas, THREE);\n    this.raycaster = new THREE.Raycaster();\n\n    const clock = new THREE.Clock();\n    let lastEmit = 0;\n    // one creature at a time, each show barely overlapping the next\n    const sched = { list: [], last: null };\n    // 1 is the hollow, up the trunk — only the climbers may visit it\n    const canVisit = { squirrel: [0, 1, 2, 4], lizard: [0, 1, 2, 4], scorpion: [0, 1, 2, 4], snake: [0, 2, 4], frog: [0, 2, 4] };\n    const flight = { t: 0, active: false, at: 'A', dur: 3.8 };\n\n    const loop = () => {\n      this.rafId = requestAnimationFrame(loop);\n      const t = clock.getElapsedTime();\n\n      // the scene takes turns featuring each interactive form\n      const SPOT = 7.5;\n      const fIdx = Math.floor((t / SPOT) % hotspots.length);\n      const fPhase = (t % SPOT) / SPOT;\n      const attn = Math.sin(Math.min(1, Math.max(0, (fPhase - 0.1) / 0.8)) * Math.PI);\n      const fh = hotspots[fIdx];\n      const fCenter = fh.kind ? fh.group.position : fh.center;\n\n      this.parallax.x += (this.parallax.tx - this.parallax.x) * 0.05;\n      this.parallax.y += (this.parallax.ty - this.parallax.y) * 0.05;\n      const bias = attn * 0.2;\n      camera.position.set(10 + this.parallax.x * 2.4 + fCenter.x * bias * 0.3, 8.5 + this.parallax.y * 1.6 + (fCenter.y - 6) * bias * 0.25, 23 - Math.abs(this.parallax.x) * 0.7);\n      camera.lookAt(this.parallax.x * 1.0 + fCenter.x * bias, 6 + this.parallax.y * 0.55 + (fCenter.y - 6) * bias * 0.4, fCenter.z * bias * 0.5);\n      camera.rotation.z = this.parallax.x * 0.01;\n\n      hotspots.forEach(h => {\n        const active = h.index === this.hoverIndex || h.index === this.openIndex;\n        const feat = Math.max(h.index === fIdx ? attn : 0, h.trig);\n        const breathe = 0.5 + Math.sin(t * 0.7 + h.index * 1.5) * 0.5;\n        // glitching silhouette shimmer — stepped jitter on the back-facing shell\n        const gl = h.gl;\n        if (t > gl.next) {\n          gl.next = t + (active ? 0.1 + Math.random() * 0.12 : feat > 0.3 ? 0.3 + Math.random() * 0.4 : 0.9 + Math.random() * 1.3);\n          const amp = active ? 0.11 : 0.03 + feat * 0.05;\n          gl.ox = (Math.random() - 0.5) * amp;\n          gl.oy = (Math.random() - 0.5) * amp * 0.6;\n          gl.s = 1 + (Math.random() - 0.3) * (active ? 0.05 : 0.012 + feat * 0.02);\n          gl.o = active ? 0.35 + Math.random() * 0.5 : (h.kind === 'crow' ? 0.12 : 0.04) + feat * 0.42 + Math.random() * 0.06;\n          h.outline.material.color.copy(PALE).lerp(h.glow, Math.random() * (active ? 0.75 : 0.4));\n        }\n        h.outline.position.set(gl.ox, gl.oy, 0);\n        h.outline.scale.setScalar(gl.s);\n        h.outline.material.opacity = gl.o * (0.8 + breathe * 0.25);\n        h.light.intensity = active ? 2.4 : 0.45 + feat * 1.3 + breathe * 0.3;\n        h.halo.quaternion.copy(camera.quaternion);\n        h.halo.rotate .5) * 0.4 + (this.hoverIndex === 3 ? 0.6 : 0);\n      }\n      crow.pick.position.copy(crow.group.position);\n      crow.halo.position.copy(crow.group.position);\n      crow.light.position.copy(crow.group.position);\n\n      // ---- creature scheduler: one on stage, handing off with a short overlap ----\n      const roster = ['squirrel', 'frog', 'lizard', 'scorpion', 'snake'];\n      while (sched.list.length < 2) {\n        const prev = sched.list[sched.list.length - 1];\n        const prevEnd = prev ? prev.start + prev.dur : t + 0.4;\n        const avail = roster.filter(k => k !== sched.last);\n        const who = avail[Math.floor(Math.random() * avail.length)];\n        sched.last = who;\n        const pool = canVisit[who];\n        sched.list.push({\n          who, start: prevEnd - 1.3, dur: 11 + Math.random() * 6,\n          target: pool[Math.floor(Math.random() * pool.length)],\n        });\n      }\n      while (sched.list.length && sched.list[0].start + sched.list[0].dur < t) sched.list.shift();\n      const showOf = (k) => {\n        for (const s of sched.list) if (s.who === k && t >= s.start && t <= s.start + s.dur) return s;\n        return null;\n      };\n      const phase = (k) => { const s = showOf(k); return s ? (t - s.start) / s.dur : -1; };\n      // draws the creature toward the form it has come to visit, then releases it\n      const approach = (obj, k, p, amt, opts) => {\n        const s = showOf(k);\n        if (!s) return 0;\n        const h = hotspots[s.target];\n        const c = h.kind ? h.group.position : h.center;\n        const e = Math.sin(Math.min(1, Math.max(0, (p - 0.26) / 0.46)) * Math.PI);\n        const y0 = obj.position.y;\n        obj.position.lerp(c, e * (amt ?? 0.8));\n        const o = opts || {};\n        if (o.flat) obj.position.y = y0;                       // ground-bound: never leaves the floor\n        else if (o.climb && c.y - y0 > 1.2) obj.rotation.z = o.climbTilt ?? 1.3 * Math.min(1, e * 2);\n        return e;\n lineTo(f.x, f.y) : ctx.moveTo(f.x, f.y);\n    }\n    ctx.closePath();\n    ctx.fillStyle = '#000';\n    ctx.fill();\n    ctx.restore();\n\n    // ---- organic frame: a living membrane that grows in around the panel ----\n    const N = 220, upto = Math.floor(N * age);\n    ctx.beginPath();\n    for (let i = 0; i <= upto; i++) {\n      const f = this.framePoint(n, (i / N) * Math.PI * 2, t);\n      i ? ctx.lineTo(f.x, f.y) : ctx.moveTo(f.x, f.y);\n    }\n    if (age >= 1) ctx.closePath();\n    ctx.strokeStyle = 'rgba(95,158,160,0.3)';\n    ctx.lineWidth = 4.5;\n    ctx.stroke();\n    ctx.strokeStyle = 'rgba(207,255,220,0.62)';\n    ctx.lineWidth = 1.2;\n    ctx.stroke();\n    // inner echo line\n    ctx.beginPath();\n    for (let i = 0; i <= upto; i++) {\n      const f = this.framePoint(n, (i / N) * Math.PI * 2, t + 1.7, -9);\n      i ? ctx.lineTo(f.x, f.y) : ctx.moveTo(f.x, f.y);\n    }\n    ctx.strokeStyle = 'rgba(159,211,174,0.16)';\n    ctx.lineWidth = 0.8;\n    ctx.stroke();\n\n    // radial growth: out from behind the panel to the membrane, then spreading around it\n    const el = t - n.t0;\n    n.radials.forEach((r, k) => {\n      const gp = Math.min(1, Math.max(0, (el - r.delay) / r.dur));\n      if (gp <= 0) return;\n      const steps = 16;\n      ctx.beginPath();\n      for (let i = 0; i <= steps; i++) {\n        const u = i / steps;\n        const off = -8 + r.len * gp * u;\n        const th = r.th + Math.sin(u * 3.2 + r.seed) * 0.045 + Math.sin(t * 0.3 + r.seed) * 0.012;\n        const f = this.framePoint(n, th, t, off);\n        i ? ctx.lineTo(f.x, f.y) : ctx.moveTo(f.x, f.y);\n      }\n      ctx.strokeStyle = `rgba(159,211,174,${0.1 + gp * 0.22})`;\n      ctx.lineWidth = 1.5 - gp * 0.5;\n      ctx.stroke();\n      const tip = this.framePoint(n, r.th, t, -8 + r.len * gp);\n      ctx.beginPath(); ctx.arc(tip.x, tip.y, 1.6, 0, Math.PI * 2);\n      ctx.fillStyle = `rgba(207,255,220,${0.3 + gp * 0.45})`; ctx.fill();\n      if (gp >= 1) {\n        const mid = this.framePoint(n, r.th + 0.05, t, -8 + r.len * 0.55);\n        this.tendril(ctx, mid.x, mid.y, Math.atan2(mid.ny, mid.nx) + 1.1, 16, 2, r.seed + 7, t, 0.16, 0.8, null);\n        // then it runs around the perimeter in both directions\n        const ap = Math.min(1, Math.max(0, (el - r.delay - r.dur) / r.arcDur));\n        [1, -1].forEach(dir => {\n          const span = r.span * ap * (dir > 0 ? 1 : 0.8);\n          if (span < 0.02) return;\n          ctx.beginPath();\n          const seg = 26;\n          for (let i = 0; i <= seg; i++) {\n            const s = (i / seg) * span;\n            const f = this.framePoint(n, r.th + dir * s, t, r.len - 8 - Math.sin(s * 2.4) * 6);\n            i ? ctx.lineTo(f.x, f.y) : ctx.moveTo(f.x, f.y);\n          }\n          ctx.strokeStyle = `rgba(95,158,160,${0.08 + ap * 0.2})`;\n          ctx.lineWidth = 1;\n          ctx.stroke();\n          const end = this.framePoint(n, r.th + dir * span, t, r.len - 8 - Math.sin(span * 2.4) * 6);\n          ctx.beginPath(); ctx.arc(end.x, end.y, 1.4, 0, Math.PI * 2);\n          ctx.fillStyle = `rgba(207,255,220,${0.2 + ap * 0.4})`; ctx.fill();\n          if (ap > 0.35) this.tendril(ctx, end.x, end.y, Math.atan2(end.ny, end.nx) + dir * 0.6, 14 * ap, 2, r.seed + dir * 3, t, 0.14 * ap, 0.9, null);\n        });\n      }\n    });\n\n    // randomized mycelium / slime-mold growth creeping outward, with pulses running along it\n    n.growth.forEach((g, k) => {\n      const grow = Math.max(0, Math.min(1, (age - g.delay) / (1 - g.delay))) * (0.6 + 0.4 * Math.sin(t * g.rate + k * 1.9));\n      if (grow <= 0.03) return;\n      const f = this.framePoint(n, g.th, t);\n      const path = [];\n      this.tendril(ctx, f.x, f.y, Math.atan2(f.ny, f.nx), g.len * grow, g.depth, g.seed, t, 0.26 * grow + 0.07, g.spread, path);\n      if (path.length) {\n        const u = (t * (0.13 + g.rate * 0.1) + g.seed) % 1;\n        const p = path[Math.floor(u * (path.length - 1))];\n        const al = Math.sin(u * Math.PI) * 0.75 * grow;\n        ctx.beginPath();\n        ctx.arc(p[0], p[1], 1.8, 0, Math.PI * 2);\n        ctx.fillStyle = `rgba(207,255,220,${al})`;\n        ctx.fill();\n      }\n    });\n\n    // spores riding the membrane\n    spores.forEach((s, i) => {\n      s.u = (s.u + s.s * 0.004) % 1;\n      const f = this.framePoint(n, s.u * Math.PI * 2, t, 6 + s.r * 26 * Math.sin(t * 0.5 + s.ph) ** 2);\n      const al = (0.2 + 0.55 * Math.abs(Math.sin(t * 1.1 + s.ph))) * age;\n      ctx.fillStyle = i % 4 === 0 ? `rgba(95,158,160,${al})` : `rgba(207,255,220,${al * 0.75})`;\n      const sz = i % 7 === 0 ? 2 : 1;\n      ctx.fillRect(Math.round(f.x), Math.round(f.y), sz, sz);\n    });\n  }\n\n  onResize() {\n    if (!this.three) return;\n    const c = this.canvasRef.current;\n    this.three.camera.aspect = c.clientWidth / c.clientHeight;\n    this.three.camera.updateProjectionMatrix();\n    this.three.renderer.setSize(c.clientWidth, c.clientHeight, false);\n  }\n\n  renderVals() {\n    const open = this.state.openIndex >= 0 ? this.sections[this.state.openIndex] : this.sections[0];\n    return {\n      canvasRef: this.canvasRef,\n      glitchWrapRef: this.glitchWrapRef,\n      netCanvasRef: this.netCanvasRef,\n      cursor: this.state.hoverIndex >= 0 ? 'pointer' : 'crosshair',\n      marks: this.sections.map((_, i) => ({ bg: this.state.found.includes(i) ? 'rgba(159,211,174,0.85)' : 'rgba(159,211,174,0.14)' })),\n      hint: this.state.hoverIndex >= 0 ? '◆' : (this.state.found.length >= 5 ? '' : '· · ·'),\n      isOpen: this.state.openIndex >= 0,\n      open: { ...open, hasChips: open.chips.length > 0 },\n      closeModal: () => this.closeModal(),\n    };\n  }\n}\n\n<\/script>\n\n\n<\/body><\/html>"
