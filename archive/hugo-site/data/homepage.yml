# experience
experience:
  enable: true
  title: "Experience"
  description: "18+ years leading <strong>AI/ML, Data &amp; Software Engineering, DevOps and Enterprise IT</strong> across synthetic biology, healthcare and agricultural genomics.
    <ul class='mt-3'>
      <li><strong>AI/ML &amp; Data Science</strong> &mdash; predictive modeling, experiment optimization, decision support</li>
      <li><strong>Data Engineering &amp; Architecture</strong> &mdash; modern data platforms, pipelines and governance</li>
      <li><strong>Software Engineering</strong> &mdash; tools and applications for R&amp;D, manufacturing and business</li>
      <li><strong>DevOps &amp; Cloud Infrastructure</strong> &mdash; secure, automated, scalable environments (AWS, Docker, IaC)</li>
      <li><strong>Enterprise IT &amp; Productivity</strong> &mdash; resilient systems that enable people to do their best work</li>
    </ul>
    Currently VP, Computing Technology at Amyris; also founder of CDS &ndash; Creative Data Solutions. When I am not building tools, I like to trail run, mountain bike and work on my off-grid farm."
