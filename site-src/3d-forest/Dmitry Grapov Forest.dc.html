    html,body{margin:0;padding:0;background:#000 !important;overflow:hidden}
    @keyframes fx-glitch{
      0%{transform:translate(0,0);filter:none}
      18%{transform:translate(-3px,1px);filter:hue-rotate(28deg) saturate(1.35)}
      42%{transform:translate(2px,-2px);filter:none}
      66%{transform:translate(-1px,-1px);filter:hue-rotate(-22deg)}
      100%{transform:translate(0,0);filter:none}
    }
    @keyframes fx-micro{
      0%{transform:translate(0,0)}
      40%{transform:translate(-1px,1px);filter:hue-rotate(14deg)}
      100%{transform:translate(0,0)}
    }
    @keyframes fx-blink{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
    @keyframes fx-scan{0%{transform:translateY(-12%)}100%{transform:translateY(112%)}}
    @keyframes fx-in{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}

<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {},
  &quot;seed&quot;: {&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;min&quot;:0,&quot;max&quot;:999999,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Scene&quot;},
  &quot;pixelSize&quot;: {&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1.4,&quot;min&quot;:1,&quot;max&quot;:5,&quot;step&quot;:0.2,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Scene&quot;,&quot;unit&quot;:&quot;px&quot;},
  &quot;accentA&quot;: {&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#B0748C&quot;,&quot;options&quot;:[&quot;#B0748C&quot;,&quot;#A87F5E&quot;,&quot;#8E7BB5&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Scene&quot;},
  &quot;accentB&quot;: {&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#5F9EA0&quot;,&quot;options&quot;:[&quot;#5F9EA0&quot;,&quot;#6E9BC4&quot;,&quot;#6FAF8E&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Scene&quot;}
}">
class Component extends DCLogic {
  state = { openIndex: -1, hoverIndex: -1, found: [] };

  sections = [
    { kicker:'MUSHROOM RING // ORIGIN', title:'Cultivating signal from noise', body:"Ph.D. in agricultural and environmental chemistry; 18+ years turning high-dimensional biology into human-readable signal. Now VP, Computing Technology at Amyris — leading AI/ML, data engineering, software engineering, DevOps and enterprise IT for synthetic biology — after leading data science teams at Centene, Bayer and Monsanto, and founding Creative Data Solutions. Off the clock: trail running, mountain biking, and tending an off-grid farm — same patience and feedback loops, grown into food instead of models.", chips:['Amyris','CDS','Centene','Bayer','Monsanto'], links:[{label:'LinkedIn', url:'https://www.linkedin.com/in/dmitrygrapov/'},{label:'Resume', url:'https://drive.google.com/file/d/0B51AEMfo-fh9M3FmWXVlb05pdm8/view?resourcekey=0-YUui0qQSQvIcYCjw0ls-zw'},{label:'CV', url:'https://drive.google.com/file/d/0B51AEMfo-fh9Z05aM2p6XzFIOFE/view?resourcekey=0-eWLTXJPfdNmCeAK9OWQpQA'}] },
    { kicker:'THE HOLLOW // CODE & SCIENCE', title:'Open tools for messy data', body:'Metabolomics, network analysis, and machine learning pipelines grown into open software — pathway-independent network mapping, multivariate analysis, and the tooling that makes Omics data legible.', chips:['MetaMapR','DeviumWeb','networkly','CTSgetR','imDEV'], links:[{label:'GitHub', url:'https://github.com/dgrapov'},{label:'Scholar', url:'https://scholar.google.com/citations?user=zfp5U0QAAAAJ&hl=en'}] },
    { kicker:'SLIME MOLD // TEACHING', title:'Knowledge spreads root to root', body:'Workshops, conference talks, and open tutorials on multivariate analysis, gene ontology, and network biology.', chips:[], links:[{label:'Demos', url:'https://github.com/dgrapov/TeachingDemos'},{label:'Slides', url:'https://www.slideshare.net/dgrapov'},{label:'Video', url:'https://www.youtube.com/user/dgrapov/videos'}] },
    { kicker:'THE CROW // WRITING & ART', title:"What doesn't fit in a dataframe", body:'Field notes on data science, R, and machine learning — alongside photography and image-making.', chips:[], links:[{label:'Blog', url:'https://creativedatasolutions.github.io/cds.blog/'},{label:'Flickr', url:'https://www.flickr.com/people/dgrapov/'}] },
    { kicker:'THE SPRING // CONTACT', title:"Let's grow something", body:'Open to collaboration, consulting, and conversations about network graphs or trail routes.', chips:[], links:[{label:'Email', url:'mailto:dmitry@creative-data.solutions'},{label:'LinkedIn', url:'https://www.linkedin.com/in/dmitrygrapov/'},{label:'GitHub', url:'https://github.com/dgrapov'}] },
  ];

  canvasRef = React.createRef();
  glitchWrapRef = React.createRef();
  netCanvasRef = React.createRef();
  hoverIndex = -1;
  openIndex = -1;
  found = new Set();
  net = null;
  parallax = { x: 0, y: 0, tx: 0, ty: 0 };
  lastMicro = 0;

  componentDidMount() { this.setup(); }
  componentWillUnmount() {
    if (this.rafId) cancelAnimationFrame(this.rafId);
    window.removeEventListener('resize', this.onResize);
    if (this.three) this.three.renderer.dispose();
  }
  componentDidUpdate() {
    if (this.state.openIndex >= 0 && this.netCanvasRef.current && !this.net) this.initNet();
    if (this.state.openIndex < 0) this.net = null;
  }

  glitch(ms, micro) {
    const el = this.glitchWrapRef.current;
    if (!el) return;
    el.style.animation = 'none'; void el.offsetWidth;
    el.style.animation = `${micro ? 'fx-micro' : 'fx-glitch'} ${ms || 280}ms ease-out 1`;
  }

  // ---------------- organic voxel primitives ----------------
  column(cx, cz, r, h, tone, taper) {
    const c = [];
    for (let y = 0; y < h; y++) {
      const rr = taper ? Math.max(1, r - (y / h) * taper) : r;
      const lean = Math.round(Math.sin(y * 0.06) * 0.9);
      for (let x = -Math.ceil(rr); x <= Math.ceil(rr); x++) for (let z = -Math.ceil(rr); z <= Math.ceil(rr); z++) {
        const d = Math.hypot(x, z);
        if (d > rr + 0.4) continue;
        if (d < rr - 0.9 && Math.random() > 0.18) continue;
        c.push({ x: cx + x + lean, y, z: cz + z, tone, n: Math.random() });
      }
    }
    return c;
  }
  line(from, to, r, tone) {
    const c = [];
    const d = [to[0] - from[0], to[1] - from[1], to[2] - from[2]];
    const len = Math.hypot(d[0], d[1], d[2]), steps = Math.max(2, Math.round(len * 2.4));
    for (let s = 0; s <= steps; s++) {
      const t = s / steps;
      const p = [Math.round(from[0] + d[0] * t), Math.round(from[1] + d[1] * t), Math.round(from[2] + d[2] * t)];
      for (let ox = -r; ox <= r; ox++) for (let oy = -r; oy <= r; oy++) for (let oz = -r; oz <= r; oz++)
        if (Math.hypot(ox, oy, oz) <= r + 0.4) c.push({ x: p[0] + ox, y: p[1] + oy, z: p[2] + oz, tone, n: Math.random() });
    }
    return c;
  }
  // realistic mushroom: tapered curved stem, domed cap with rolled edge, radial gills
  mushroom(cx, cy, cz, capR, lean) {
    const c = [];
    const stemH = Math.round(capR * 1.9);
    for (let y = 0; y < stemH; y++) {
      const t = y / stemH;
      const sr = Math.max(0.6, capR * (0.30 - t * 0.10));
      const ox = Math.round(Math.sin(t * 1.5) * (lean || 0));
      for (let x = -Math.ceil(sr); x <= Math.ceil(sr); x++) for (let z = -Math.ceil(sr); z <= Math.ceil(sr); z++) {
        if (Math.hypot(x, z) > sr + 0.35) continue;
        c.push({ x: cx + x + ox, y: cy + y, z: cz + z, tone: 'stem', n: Math.random() });
      }
    }
    const base = cy + stemH, cox = Math.round(Math.sin(1.5) * (lean || 0));
    for (let x = -capR - 1; x <= capR + 1; x++) for (let z = -capR - 1; z <= capR + 1; z++) {
      const d = Math.hypot(x, z);
      if (d > capR + 0.6) continue;
      const dome = Math.round(Math.sqrt(Math.max(0, 1 - (d / (capR + 0.6)) ** 2)) * capR * 0.85);
      const rolled = d > capR - 0.9;
      for (let y = 0; y <= dome; y++) {
        const surface = y === dome;
        c.push({ x: cx + x + cox, y: base + y + (rolled ? -1 : 0), z: cz + z, tone: surface ? (rolled ? 'capEdge' : 'cap') : 'capIn', n: Math.random() });
      }
    }
    for (let i = 0; i < capR * 6; i++) {
      const a = (i / (capR * 6)) * Math.PI * 2;
      for (let rr = 1.4; rr < capR - 0.4; rr += 1) {
        c.push({ x: cx + cox + Math.round(Math.cos(a) * rr), y: base - 1, z: cz + Math.round(Math.sin(a) * rr), tone: 'gill', n: Math.random() });
      }
    }
    return c;
  }
  // fern frond: arched rachis with paired pinnae that shorten toward the tip
  frond(cx, cy, cz, len, dir, tone) {
    const c = [];
    for (let i = 0; i <= len; i++) {
      const t = i / len;
      const x = Math.round(dir[0] * i * 0.85), z = Math.round(dir[1] * i * 0.85);
      const y = Math.round(Math.sin(t * 2.1) * len * 0.55);
      c.push({ x: cx + x, y: cy + y, z: cz + z, tone, n: Math.random() });
      const pl = Math.round((1 - t) * len * 0.42);
      for (let p = 1; p <= pl; p++) {
        const px = Math.round(-dir[1] * p), pz = Math.round(dir[0] * p);
        c.push({ x: cx + x + px, y: cy + y - Math.round(p * 0.4), z: cz + z + pz, tone, n: Math.random() });
        c.push({ x: cx + x - px, y: cy + y - Math.round(p * 0.4), z: cz + z - pz, tone, n: Math.random() });
      }
    }
    return c;
  }
  tuft(cx, cz, n, tone) {
    const c = [];
    for (let b = 0; b < n; b++) {
      const a = Math.random() * Math.PI * 2, h = 3 + Math.round(Math.random() * 4);
      for (let y = 1; y <= h; y++) {
        const bend = Math.round((y / h) ** 2 * 2.2);
        c.push({ x: cx + Math.round(Math.cos(a) * bend), y, z: cz + Math.round(Math.sin(a) * bend), tone, n: Math.random() });
      }
    }
    return c;
  }
  blob(cx, cy, cz, R, tone, fill) {
    const c = [], n = Math.ceil(R);
    for (let x = -n; x <= n; x++) for (let y = -n; y <= n; y++) for (let z = -n; z <= n; z++) {
      const d = Math.hypot(x, y * 1.1, z);
      if (d > R) continue;
      if (d < R - 1.2 && Math.random() > 0.3) continue;
      if (Math.random() > (fill ?? 0.9)) continue;
      c.push({ x: cx + x, y: cy + y, z: cz + z, tone, n: Math.random() });
    }
    return c;
  }
  // slime mold: dendritic random-walk growth spreading over the floor
  slime(cx, cz, arms, steps, tone, nodeTone) {
    const c = [];
    const walk = (x, z, a, len, w) => {
      for (let s = 0; s < len; s++) {
        a += (Math.random() - 0.5) * 0.6;
        x += Math.cos(a) * 1.1; z += Math.sin(a) * 1.1;
        const rx = Math.round(x), rz = Math.round(z);
        c.push({ x: cx + rx, y: 1, z: cz + rz, tone, n: Math.random() });
        if (w > 0) c.push({ x: cx + rx, y: 2, z: cz + rz, tone, n: Math.random() });
        if (s > 3 && s % 7 === 0) c.push(...this.blob(cx + rx, 2, cz + rz, 1.5, nodeTone, 0.85));
        if (w > 0 && Math.random() < 0.14) walk(x, z, a + (Math.random() < 0.5 ? 1 : -1) * 0.9, Math.round(len * 0.5), w - 1);
      }
    };
    for (let i = 0; i < arms; i++) walk(0, 0, (i / arms) * Math.PI * 2, steps, 2);
    c.push(...this.blob(cx, 2, cz, 2.4, nodeTone, 0.9));
    return c;
  }

  makeInst(THREE, cells, step, sizeMul, toneColor, opts) {
    const o = opts || {};
    const geo = new THREE.BoxGeometry(step * sizeMul, step * sizeMul, step * sizeMul);
    const mat = o.unlit
      ? new THREE.MeshBasicMaterial({ transparent: true, opacity: o.opacity ?? 1, side: o.side || THREE.FrontSide })
      : new THREE.MeshLambertMaterial({ transparent: true, opacity: o.opacity ?? 1, side: o.side || THREE.FrontSide });
    const inst = new THREE.InstancedMesh(geo, mat, cells.length);
    const d = new THREE.Object3D();
    cells.forEach((c, i) => {
      d.position.set(c.x * step, c.y * step, c.z * step);
      d.updateMatrix();
      inst.setMatrixAt(i, d.matrix);
      inst.setColorAt(i, o.forceColor || toneColor(c));
    });
    inst.instanceMatrix.needsUpdate = true;
    if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
    inst.frustumCulled = false;
    return inst;
  }
  makeVox(THREE, cells, step, sizeMul, toneColor, opts) {
    const emissive = { cap: 1, capEdge: 1, gill: 1, water: 1, waterRim: 1, slimeNode: 1, slimeArm: 1, glow: 1, lichen: 1, frogEye: 1, lizardEye: 1, scorpTip: 1 };
    const g = new THREE.Group();
    g.parts = [];
    const lit = cells.filter(c => !emissive[c.tone]), un = cells.filter(c => emissive[c.tone]);
    if (lit.length) { const m = this.makeInst(THREE, lit, step, sizeMul, toneColor, opts); g.add(m); g.parts.push(m); }
    if (un.length) { const m = this.makeInst(THREE, un, step, sizeMul, toneColor, { ...(opts || {}), unlit: true }); g.add(m); g.parts.push(m); }
    return g;
  }

  // deterministic PRNG so each seed grows a unique but reproducible forest
  rand(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  frog(cx, cy, cz) {
    const c = [
      ...this.blob(0, 0, 0, 2.2, 'frogSkin', 0.98),
      ...this.blob(-1, -1, 0, 1.6, 'frogSkin', 0.9),
      { x: 1, y: 2, z: 1, tone: 'frogEye', n: 0.6 }, { x: 1, y: 2, z: -1, tone: 'frogEye', n: 0.4 },
      { x: 2, y: 1, z: 0, tone: 'frogSkin', n: 0.5 },
      ...this.line([-1, -1, 2], [1, -2, 3], 0, 'frogSkin'),
      ...this.line([-1, -1, -2], [1, -2, -3], 0, 'frogSkin'),
      ...this.line([1, -2, 3], [3, -2, 3], 0, 'frogSkin'),
      ...this.line([1, -2, -3], [3, -2, -3], 0, 'frogSkin'),
    ];
    return c.map(v => ({ ...v, x: v.x + cx, y: v.y + cy, z: v.z + cz }));
  }

  softSprite(size, inner) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
    g.addColorStop(0, `rgba(255,255,255,${inner})`);
    g.addColorStop(0.45, `rgba(255,255,255,${inner * 0.3})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);
    return c;
  }

  async setup() {
    const THREE = await import('three');
    const canvas = this.canvasRef.current;
    if (!canvas) return;
    const px = this.props.pixelSize ?? 1.4;
    const step = 0.4;
    const seed = Math.floor(this.props.seed ?? 0) || Math.floor(Math.random() * 1e9);
    const R = this.rand(seed);
    const pick1 = (arr) => arr[Math.floor(R() * arr.length)];

    const INK = new THREE.Color('#071410');
    const BARK = new THREE.Color('#16352A');
    const MID = new THREE.Color('#1C5934');
    const LEAF = new THREE.Color('#3E8F5C');
    const PALE = new THREE.Color('#9FD3AE');
    const ACC_A = new THREE.Color(this.props.accentA ?? '#B0748C');
    const ACC_B = new THREE.Color(this.props.accentB ?? '#5F9EA0');
    const AMBER = new THREE.Color('#9E7F52');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#030706');
    scene.fog = new THREE.FogExp2(0x030706, 0.03);

    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 400);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: px <= 1.5 });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2) / px);

    scene.add(new THREE.AmbientLight(0x0a1a14, 0.55));
    const key = new THREE.DirectionalLight(new THREE.Color('#E8FFF2'), 1.35);
    key.position.set(-10, 17, 12);
    scene.add(key);
    const rim = new THREE.DirectionalLight(ACC_B, 0.4);
    rim.position.set(12, 5, -10);
    scene.add(rim);

    const mixR = (a, b, lo, hi, n) => a.clone().lerp(b, lo + (n ?? Math.random()) * (hi - lo));
    const toneColor = (c) => {
      const n = c.n ?? Math.random();
      switch (c.tone) {
        case 'bark': return mixR(new THREE.Color('#1B3D2F'), new THREE.Color('#3A7259'), 0.25, 1.0, n);
        case 'vine': return mixR(INK, MID, 0.25, 0.55, n);
        case 'wood': return mixR(BARK, MID, 0.3, 0.9, n);
        case 'stem': return mixR(new THREE.Color('#2C3B33'), PALE, 0.3, 0.62, n);
        case 'capIn': return mixR(INK, ACC_A, 0.1, 0.24, n).multiplyScalar(0.8);
        case 'cap': return ACC_A.clone().lerp(MID, 0.34).lerp(PALE, 0.04 + n * 0.16).multiplyScalar(0.82);
        case 'capEdge': return ACC_A.clone().lerp(new THREE.Color('#C9D6CC'), 0.3 + n * 0.28).multiplyScalar(0.86);
        case 'gill': return ACC_A.clone().lerp(MID, 0.3).multiplyScalar(0.42 + n * 0.18);
        case 'capDull': return mixR(new THREE.Color('#2C4438'), new THREE.Color('#57715F'), 0.2, 0.8, n);
        case 'gillDull': return mixR(INK, new THREE.Color('#3E5449'), 0.2, 0.7, n);
        case 'frond': return mixR(MID, LEAF, 0.2, 0.95, n);
        case 'grass': return mixR(MID, LEAF, 0.35, 1.0, n);
        case 'rock': return mixR(INK, new THREE.Color('#2A3A33'), 0.2, 0.9, n);
        case 'crow': return mixR(new THREE.Color('#0C1F19'), new THREE.Color('#4A8A72'), 0.2, 1.0, n);
        case 'sq': return mixR(new THREE.Color('#2A3B2C'), AMBER, 0.25, 0.8, n);
        case 'slimeArm': return AMBER.clone().lerp(MID, 0.32).lerp(ACC_A, 0.08 + n * 0.22).multiplyScalar(0.8);
        case 'slimeNode': return AMBER.clone().lerp(PALE, 0.2 + n * 0.28).multiplyScalar(0.82);
        case 'water': return ACC_B.clone().lerp(MID, 0.28).multiplyScalar(0.42 + n * 0.2);
        case 'waterRim': return ACC_B.clone().lerp(PALE, 0.16 + n * 0.28).multiplyScalar(0.8);
        case 'glow': return PALE.clone().multiplyScalar(0.7 + n * 0.3);
        case 'lichen': return ACC_B.clone().lerp(PALE, 0.2 + n * 0.5);
        case 'frogSkin': return mixR(new THREE.Color('#25543C'), new THREE.Color('#6FAF8E'), 0.2, 1.0, n);
        case 'frogEye': return ACC_A.clone().lerp(PALE, 0.45);
        case 'lizard': return mixR(new THREE.Color('#1E4A44'), new THREE.Color('#5E9A8E'), 0.2, 1.0, n);
        case 'lizardEye': return ACC_B.clone().lerp(PALE, 0.4);
        case 'scorp': return mixR(new THREE.Color('#2E2A38'), new THREE.Color('#7A6E92'), 0.2, 1.0, n);
        case 'scorpTip': return ACC_A.clone().lerp(PALE, 0.35);
        default: return mixR(MID, LEAF, 0.3, 0.8, n);
      }
    };

    // ---------------- scenery ----------------
    // each interactive form gets its own clearing, well separated on screen
    const MC = [-23 + Math.round(R() * 3), 10 + Math.round(R() * 3)];
    const SC = [-5 + Math.round(R() * 4), -15 + Math.round(R() * 3)];
    const PC = [17 + Math.round(R() * 3), 8 + Math.round(R() * 2)];
    const keepClear = [{ x: MC[0], z: MC[1], r: 19 }, { x: SC[0], z: SC[1], r: 15 }, { x: PC[0], z: PC[1], r: 11 }];
    const clear = (x, z) => !keepClear.some(k => Math.hypot(x - k.x, z - k.z) < k.r);
    let bg = [];
    bg = bg.concat(this.column(-19, -5, 3, 58, 'bark', 1.2));
    bg = bg.concat(this.column(18, -12, 3, 60, 'bark', 1.2));
    bg = bg.concat(this.column(4, -28, 2, 54, 'bark', 1));
    bg = bg.concat(this.column(-10, -34, 2, 50, 'bark', 1));
    bg = bg.concat(this.column(26, -32, 2, 48, 'bark', 1));
    bg = bg.concat(this.line([-19, 24, -5], [-7, 26, 3], 1, 'wood'));
    bg = bg.concat(this.line([18, 24, -12], [8, 25, -5], 1, 'wood'));
    bg = bg.concat(this.line([18, 17, -12], [11, 18, -4], 0, 'wood'));
    // hanging vines — drifting strands, kept darker than the interactive elements
    for (let v = 0; v < 7; v++) {
      let vx = -7 + v * 3, vz = 2;
      const top = 24 - (v % 3) * 2, len = 6 + (v % 4) * 3, phase = v * 1.7;
      for (let s = 0; s < len; s++) {
        vx += Math.sin(phase + s * 0.55) * 0.7;
        vz += Math.cos(phase + s * 0.4) * 0.35;
        if (s % 3 === 2) continue;
        bg.push({ x: Math.round(vx), y: top - s, z: Math.round(vz), tone: 'vine', n: Math.random() });
      }
    }
    bg = bg.concat(this.line([-6, 2, 11], [6, 2, 10], 2, 'bark'));
    bg = bg.concat(this.blob(-4, 1, 14, 2.6, 'rock', 0.95));
    bg = bg.concat(this.blob(13, 1, 11, 2.0, 'rock', 0.95));
    bg = bg.concat(this.blob(21, 1, -2, 3.0, 'rock', 0.9));
    // ferns
    for (let f = 0; f < 22; f++) {
      const fx = Math.round((Math.random() - 0.5) * 52), fz = Math.round(-Math.random() * 30 + 13);
      if (!clear(fx, fz)) continue;
      const n = 5 + Math.round(Math.random() * 3);
      for (let b = 0; b < n; b++) {
        const a = (b / n) * Math.PI * 2 + Math.random() * 0.4;
        bg = bg.concat(this.frond(fx, 1, fz, 5 + Math.round(Math.random() * 4), [Math.cos(a), Math.sin(a)], 'frond'));
      }
    }
    // grass tufts
    for (let g = 0; g < 46; g++) {
      const gx = Math.round((Math.random() - 0.5) * 58), gz = Math.round(-Math.random() * 32 + 14);
      if (!clear(gx, gz)) continue;
      bg = bg.concat(this.tuft(gx, gz, 5 + Math.round(Math.random() * 5), 'grass'));
    }
    // floor litter
    for (let i = 0; i < 620; i++) {
      const lx = Math.round((Math.random() - 0.5) * 64), lz = Math.round(-Math.random() * 36 + 14);
      if (!clear(lx, lz)) continue;
      bg.push({ x: lx, y: 0, z: lz, tone: 'frond', n: Math.random() });
    }
    // scattered small mushrooms for texture
    // scattered decoy mushrooms — deliberately duller than the interactive ring
    const dullMap = { cap: 'capDull', capEdge: 'capDull', capIn: 'gillDull', gill: 'gillDull' };
    for (let m = 0; m < 9; m++) {
      const mx = Math.round((Math.random() - 0.5) * 44), mz = Math.round(-Math.random() * 24 + 12);
      if (!clear(mx, mz)) continue;
      bg = bg.concat(this.mushroom(mx, 1, mz, 2, 1).map(c => ({ ...c, tone: dullMap[c.tone] || c.tone })));
    }
    // data-lichen: bioluminescent patches creeping up the trunks
    bg.forEach(c => { if (c.tone === 'bark' && R() < 0.022 && c.y > 2) c.tone = 'lichen'; });
    const scenery = this.makeVox(THREE, bg, step, 0.95, toneColor);
    scene.add(scenery);

    // ---------------- hotspots ----------------
    // geometry motifs are dealt out differently on every seed
    const motifs = ['flower', 'vesica', 'metatron', 'spiral', 'yantra'];
    for (let i = motifs.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [motifs[i], motifs[j]] = [motifs[j], motifs[i]]; }
    const hotspots = [];
    const geomMotif = (THREE, kind, r, color) => {
      const g = new THREE.Group();
      const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.2 });
      const circle = (rr, ox, oy) => {
        const p = [];
        for (let i = 0; i <= 64; i++) { const a = (i / 64) * Math.PI * 2; p.push(new THREE.Vector3(Math.cos(a) * rr + ox, Math.sin(a) * rr + oy, 0)); }
        return new THREE.Line(new THREE.BufferGeometry().setFromPoints(p), mat);
      };
      const poly = (n, rr, rot) => {
        const p = [];
        for (let i = 0; i <= n; i++) { const a = (i / n) * Math.PI * 2 + (rot || 0); p.push(new THREE.Vector3(Math.cos(a) * rr, Math.sin(a) * rr, 0)); }
        return new THREE.Line(new THREE.BufferGeometry().setFromPoints(p), mat);
      };
      if (kind === 'flower') { g.add(circle(r, 0, 0)); for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2; g.add(circle(r, Math.cos(a) * r, Math.sin(a) * r)); } }
      else if (kind === 'vesica') { g.add(circle(r, -r * 0.5, 0)); g.add(circle(r, r * 0.5, 0)); g.add(poly(2, r * 1.5, Math.PI / 2)); }
      else if (kind === 'metatron') {
        g.add(poly(6, r)); g.add(poly(6, r * 0.5, Math.PI / 6)); g.add(poly(3, r, Math.PI / 2)); g.add(poly(3, r, -Math.PI / 2));
        for (let i = 0; i < 6; i++) { const a = (i / 6) * Math.PI * 2; g.add(circle(r * 0.16, Math.cos(a) * r, Math.sin(a) * r)); }
      }
      else if (kind === 'spiral') {
        const p = [];
        for (let i = 0; i <= 220; i++) { const a = (i / 220) * Math.PI * 6; const rr = r * 0.12 * Math.exp(0.22 * a); if (rr > r * 1.4) break; p.push(new THREE.Vector3(Math.cos(a) * rr, Math.sin(a) * rr, 0)); }
        g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p), mat));
        g.add(circle(r * 0.9, 0, 0));
      }
      else { // yantra — nested triangles
        g.add(poly(3, r, Math.PI / 2)); g.add(poly(3, r, -Math.PI / 2));
        g.add(poly(3, r * 0.62, Math.PI / 2)); g.add(poly(3, r * 0.62, -Math.PI / 2));
        g.add(circle(r * 1.12, 0, 0));
      }
      g.mat = mat;
      return g;
    };

    const addHotspot = (cells, glowColor, glowPos, motif, extra) => {
      const g = new THREE.Group();
      const body = this.makeVox(THREE, cells, step, 0.95, toneColor);
      g.add(body);
      const outline = this.makeInst(THREE, cells, step, 1.3, toneColor, { side: THREE.BackSide, forceColor: PALE.clone(), opacity: 0.16, unlit: true });
      g.add(outline);
      scene.add(g);
      const box = new THREE.Box3().setFromObject(body);
      const size = new THREE.Vector3(), center = new THREE.Vector3();
      box.getSize(size); box.getCenter(center);
      const pick = new THREE.Mesh(new THREE.BoxGeometry(Math.max(size.x, 1.4), Math.max(size.y, 1.4), Math.max(size.z, 1.4)), new THREE.MeshBasicMaterial({ transparent: true, opacity: 0, depthWrite: false }));
      pick.position.copy(center);
      scene.add(pick);
      const light = new THREE.PointLight(glowColor, 1.0, 14, 2);
      light.position.copy(glowPos ? new THREE.Vector3(glowPos[0] * step, glowPos[1] * step, glowPos[2] * step) : center);
      scene.add(light);
      const halo = geomMotif(THREE, motif, Math.max(size.x, size.y) * 0.6, glowColor);
      halo.position.copy(center);
      scene.add(halo);
      // plasma wisp orbiting the object
      const WN = 90;
      const wpos = new Float32Array(WN * 3);
      const wgeo = new THREE.BufferGeometry();
      wgeo.setAttribute('position', new THREE.BufferAttribute(wpos, 3));
      const wisp = new THREE.Points(wgeo, new THREE.PointsMaterial({ color: glowColor, size: 0.5, map: new THREE.CanvasTexture(this.softSprite(48, 0.8)), transparent: true, opacity: 0.3, depthWrite: false, blending: THREE.AdditiveBlending }));
      wisp.frustumCulled = false;
      scene.add(wisp);
      body.parts.forEach(m => { m.userData.hsIndex = hotspots.length; });
      pick.userData.hsIndex = hotspots.length;
      // hollow-style outline forms have no solid surface — they hit against their proxy box
      const targets = (extra && extra.proxyPick) ? [pick] : body.parts.slice();
      hotspots.push({ group: g, body, outline, pick, light, halo, wisp, wpos, wgeo, WN, glow: glowColor, trig: 0, lastTouch: 0, targets, gl: { next: 0, ox: 0, oy: 0, s: 1, o: 0 }, radius: Math.max(size.x, size.z) * 0.5, center: center.clone(), index: hotspots.length, ...(extra || {}) });
    };

    // 0 — mushroom ring (flower of life)
    let ring = [];
    const mc = MC;
    const satN = 4 + Math.floor(R() * 2);
    ring = ring.concat(this.mushroom(mc[0], 1, mc[1], 5, 2));
    for (let i = 0; i < satN; i++) {
      const a = (i / satN) * Math.PI * 2 + R() * 0.8;
      ring = ring.concat(this.mushroom(mc[0] + Math.round(Math.cos(a) * (13 + R() * 3)), 1, mc[1] + Math.round(Math.sin(a) * (10 + R() * 3)), 2 + Math.floor(R() * 3), i % 2 ? -1 : 2));
    }
    addHotspot(ring, ACC_A, [mc[0], 8, mc[1]], motifs[0]);

    // 1 — arched hollow (vesica)
    let hollow = [];
    for (let y = 0; y <= 13; y++) {
      const w = Math.round(4.2 * Math.sin((y / 13) * Math.PI) + (y < 4 ? 0.8 : 0));
      for (let x = -w; x <= w; x++) {
        const edge = Math.abs(x) === w || y === 13;
        if (edge) hollow.push({ x: 18 + x, y: 5 + y, z: -9, tone: y > 8 ? 'waterRim' : 'water', n: Math.random() });
        else if (Math.random() < 0.08) hollow.push({ x: 18 + x, y: 5 + y, z: -9, tone: 'water', n: Math.random() });
      }
    }
    addHotspot(hollow, ACC_B, [18, 11, -9], motifs[1], { proxyPick: true });

    // 2 — slime mold spreading over the floor
    const sc = SC;
    const slimeCells = this.slime(sc[0], sc[1], 5 + Math.floor(R() * 3), 14 + Math.floor(R() * 6), 'slimeArm', 'slimeNode');
    addHotspot(slimeCells, AMBER, [sc[0], 3, sc[1]], motifs[2]);

    // 3 — the crow (golden spiral)
    const crowCells = [
      ...this.blob(0, 0, 0, 2.6, 'crow', 0.98),
      ...this.blob(2, 2, 0, 1.6, 'crow', 0.98),
      { x: 4, y: 2, z: 0, tone: 'capEdge', n: 0.5 }, { x: 4, y: 2, z: 1, tone: 'capEdge', n: 0.7 },
      ...this.line([-2, 0, 0], [-7, 2, 0], 0, 'crow'),
      ...this.line([-2, -1, 0], [-5, 0, 0], 0, 'crow'),
      { x: 0, y: -3, z: 0, tone: 'crow', n: 0.4 }, { x: 1, y: -3, z: 0, tone: 'crow', n: 0.6 },
      { x: 0, y: -4, z: 0, tone: 'crow', n: 0.5 }, { x: 1, y: -4, z: 1, tone: 'crow', n: 0.3 },
    ];
    addHotspot(crowCells, ACC_A, null, motifs[3], { kind: 'crow' });
    const crow = hotspots[3];
    crow.perchA = new THREE.Vector3(-7 * step, 27 * step, 3 * step);
    crow.perchB = new THREE.Vector3(9 * step, 25 * step, -4 * step);
    crow.group.position.copy(crow.perchA);
    const wingGeo = new THREE.BoxGeometry(step * 4.6, step * 0.5, step * 2.4);
    const wingMat = new THREE.MeshLambertMaterial({ color: new THREE.Color('#0A1A14') });
    crow.wingL = new THREE.Mesh(wingGeo, wingMat); crow.wingL.position.set(0, step * 1.2, step * 2);
    crow.wingR = new THREE.Mesh(wingGeo, wingMat); crow.wingR.position.set(0, step * 1.2, -step * 2);
    crow.group.add(crow.wingL); crow.group.add(crow.wingR);

    // 4 — the spring (yantra)
    let pool = [];
    const pc = PC;
    for (let x = -7; x <= 7; x++) for (let z = -6; z <= 6; z++) {
      const d = Math.hypot(x, z * 1.15);
      if (d > 6.6) continue;
      const rimEdge = d > 5.6;
      if (!rimEdge && Math.random() > 0.5) continue;
      pool.push({ x: pc[0] + x, y: rimEdge ? 1 : 0, z: pc[1] + z, tone: rimEdge ? 'waterRim' : 'water', n: Math.random() });
    }
    addHotspot(pool, ACC_B, [pc[0], 2, pc[1]], motifs[4]);

    // squirrel
    const sqCells = [
      ...this.blob(0, 0, 0, 1.9, 'sq', 0.98),
      ...this.blob(2, 1.4, 0, 1.3, 'sq', 0.98),
      { x: 3, y: 3, z: 0, tone: 'sq', n: 0.5 }, { x: 3, y: 2, z: 0, tone: 'sq', n: 0.7 },
      ...this.line([-2, 0, 0], [-4, 3, 0], 0, 'sq'),
      ...this.line([-4, 3, 0], [-2, 5, 0], 0, 'sq'),
      { x: 0, y: -2, z: 0, tone: 'sq', n: 0.4 }, { x: 1, y: -2, z: 0, tone: 'sq', n: 0.6 },
    ];
    const squirrel = new THREE.Group();
    squirrel.add(this.makeVox(THREE, sqCells, step, 0.95, toneColor));
    scene.add(squirrel);

    // frog — sits by the spring, hops between two stones
    const frog = new THREE.Group();
    frog.add(this.makeVox(THREE, this.frog(0, 0, 0), step, 0.95, toneColor));
    scene.add(frog);
    const frogA = new THREE.Vector3((PC[0] - 9) * step, 2.6 * step, (PC[1] + 1) * step);
    const frogB = new THREE.Vector3((PC[0] - 4) * step, 2.6 * step, (PC[1] + 6) * step);
    frog.position.copy(frogA);
    const frogLight = new THREE.PointLight(ACC_A, 0.5, 5, 2);
    scene.add(frogLight);

    // lizard — darts along the top of the big rock
    const lizardCells = [
      ...this.line([-3, 0, 0], [3, 0, 0], 0, 'lizard'),
      ...this.blob(3, 0, 0, 1.4, 'lizard', 0.95),
      { x: 4, y: 1, z: 1, tone: 'lizardEye', n: 0.5 }, { x: 4, y: 1, z: -1, tone: 'lizardEye', n: 0.7 },
      ...this.line([-3, 0, 0], [-8, 0, 1], 0, 'lizard'),
      ...this.line([1, 0, 1], [3, -1, 2], 0, 'lizard'), ...this.line([1, 0, -1], [3, -1, -2], 0, 'lizard'),
      ...this.line([-2, 0, 1], [-4, -1, 2], 0, 'lizard'), ...this.line([-2, 0, -1], [-4, -1, -2], 0, 'lizard'),
    ];
    const lizard = new THREE.Group();
    lizard.add(this.makeVox(THREE, lizardCells, step, 0.95, toneColor));
    scene.add(lizard);

    // scorpion — patrols the litter with its tail raised
    const scorpCells = [
      ...this.blob(0, 0, 0, 1.8, 'scorp', 0.95),
      ...this.blob(2, 0, 0, 1.2, 'scorp', 0.95),
      ...this.line([-2, 0, 0], [-4, 1, 0], 0, 'scorp'),
      ...this.line([-4, 1, 0], [-5, 3, 0], 0, 'scorp'),
      ...this.line([-5, 3, 0], [-3, 4, 0], 0, 'scorp'),
      { x: -2, y: 4, z: 0, tone: 'scorpTip', n: 0.5 },
      ...this.line([3, 0, 1], [5, 0, 2], 0, 'scorp'), ...this.line([3, 0, -1], [5, 0, -2], 0, 'scorp'),
      ...this.line([0, -1, 2], [2, -1, 3], 0, 'scorp'), ...this.line([0, -1, -2], [2, -1, -3], 0, 'scorp'),
      ...this.line([-1, -1, 2], [-3, -1, 3], 0, 'scorp'), ...this.line([-1, -1, -2], [-3, -1, -3], 0, 'scorp'),
    ];
    const scorpion = new THREE.Group();
    scorpion.add(this.makeVox(THREE, scorpCells, step, 0.95, toneColor));
    scene.add(scorpion);

    // snake — segmented body that slithers across the clearing
    const SEG = 18;
    const snakeMat = new THREE.MeshLambertMaterial();
    const snake = new THREE.InstancedMesh(new THREE.BoxGeometry(step * 1.6, step * 1.6, step * 1.6), snakeMat, SEG);
    snake.frustumCulled = false;
    const snakeBody = new THREE.Color('#1B4038'), snakeSkin = new THREE.Color('#63A08C');
    for (let i = 0; i < SEG; i++) snake.setColorAt(i, snakeBody.clone().lerp(i < 2 ? PALE : snakeSkin, i % 2 ? 0.65 : 0.3));
    if (snake.instanceColor) snake.instanceColor.needsUpdate = true;
    scene.add(snake);
    const snakeDummy = new THREE.Object3D();
    const snakeHead = new THREE.Vector3();

    // faint links from the moving creatures to whatever the scene is currently featuring
    const linkPos = new Float32Array(18);
    const linkGeo = new THREE.BufferGeometry();
    linkGeo.setAttribute('position', new THREE.BufferAttribute(linkPos, 3));
    const linkMat = new THREE.LineBasicMaterial({ color: PALE, transparent: true, opacity: 0.1 });
    const links = new THREE.LineSegments(linkGeo, linkMat);
    links.frustumCulled = false;
    scene.add(links);

    // travelling bioluminescent pulse that sweeps the forest floor
    const pulse = new THREE.PointLight(PALE, 0, 16, 2);
    pulse.position.set(0, 1.6, 4);
    scene.add(pulse);

    // ---------------- atmosphere ----------------
    const smokeTex = new THREE.CanvasTexture(this.softSprite(128, 0.5));
    const SM = 90;
    const smpos = new Float32Array(SM * 3);
    for (let i = 0; i < SM; i++) {
      smpos[i * 3] = (Math.random() - 0.5) * 40;
      smpos[i * 3 + 1] = Math.random() * 12;
      smpos[i * 3 + 2] = (Math.random() - 0.5) * 32 - 2;
    }
    const smgeo = new THREE.BufferGeometry();
    smgeo.setAttribute('position', new THREE.BufferAttribute(smpos, 3));
    const smmat = new THREE.PointsMaterial({ color: new THREE.Color('#2E6B58'), size: 7.5, map: smokeTex, transparent: true, opacity: 0.1, depthWrite: false, blending: THREE.AdditiveBlending });
    scene.add(new THREE.Points(smgeo, smmat));

    // digital shimmer sampled off the scenery surfaces
    const shimmerCells = bg.filter(() => Math.random() < 0.05).slice(0, 700);
    const shpos = new Float32Array(shimmerCells.length * 3);
    shimmerCells.forEach((c, i) => { shpos[i * 3] = c.x * step; shpos[i * 3 + 1] = c.y * step; shpos[i * 3 + 2] = c.z * step; });
    const shgeo = new THREE.BufferGeometry();
    shgeo.setAttribute('position', new THREE.BufferAttribute(shpos, 3));
    const shmat = new THREE.PointsMaterial({ color: PALE, size: 0.12, transparent: true, opacity: 0.25, depthWrite: false, blending: THREE.AdditiveBlending });
    scene.add(new THREE.Points(shgeo, shmat));

    const SP = 300;
    const spos = new Float32Array(SP * 3);
    for (let i = 0; i < SP; i++) {
      spos[i * 3] = (Math.random() - 0.5) * 40;
      spos[i * 3 + 1] = Math.random() * 16;
      spos[i * 3 + 2] = (Math.random() - 0.5) * 30 - 2;
    }
    const sgeo = new THREE.BufferGeometry();
    sgeo.setAttribute('position', new THREE.BufferAttribute(spos, 3));
    scene.add(new THREE.Points(sgeo, new THREE.PointsMaterial({ color: PALE, size: 0.28, map: new THREE.CanvasTexture(this.softSprite(32, 0.9)), transparent: true, opacity: 0.3, depthWrite: false, blending: THREE.AdditiveBlending })));

    const MAX = 600;
    const bpos = new Float32Array(MAX * 3);
    const bcol = new Float32Array(MAX * 3);
    for (let i = 0; i < MAX; i++) bpos[i * 3 + 1] = 9999;
    const bgeo = new THREE.BufferGeometry();
    bgeo.setAttribute('position', new THREE.BufferAttribute(bpos, 3));
    bgeo.setAttribute('color', new THREE.BufferAttribute(bcol, 3));
    const bpts = new THREE.Points(bgeo, new THREE.PointsMaterial({ vertexColors: true, size: 0.34, map: new THREE.CanvasTexture(this.softSprite(32, 0.9)), transparent: true, opacity: 0.55, depthWrite: false, blending: THREE.AdditiveBlending }));
    bpts.frustumCulled = false;
    scene.add(bpts);
    this.bursts = [];

    camera.position.set(10, 8.5, 23);
    camera.lookAt(0, 6, 0);
    this.three = { THREE, scene, camera, renderer, hotspots, squirrel, spos, sgeo, SP, smpos, smgeo, SM, smmat, shmat, bpos, bgeo, MAX, step };

    this.onResize = this.onResize.bind(this);
    window.addEventListener('resize', this.onResize);
    this.onResize();
    this.bindPointer(canvas, THREE);
    this.raycaster = new THREE.Raycaster();

    const clock = new THREE.Clock();
    let lastEmit = 0;
    // one creature at a time, each show barely overlapping the next
    const sched = { list: [], last: null };
    // 1 is the hollow, up the trunk — only the climbers may visit it
    const canVisit = { squirrel: [0, 1, 2, 4], lizard: [0, 1, 2, 4], scorpion: [0, 1, 2, 4], snake: [0, 2, 4], frog: [0, 2, 4] };
    const flight = { t: 0, active: false, at: 'A', dur: 3.8 };

    const loop = () => {
      this.rafId = requestAnimationFrame(loop);
      const t = clock.getElapsedTime();

      // the scene takes turns featuring each interactive form
      const SPOT = 7.5;
      const fIdx = Math.floor((t / SPOT) % hotspots.length);
      const fPhase = (t % SPOT) / SPOT;
      const attn = Math.sin(Math.min(1, Math.max(0, (fPhase - 0.1) / 0.8)) * Math.PI);
      const fh = hotspots[fIdx];
      const fCenter = fh.kind ? fh.group.position : fh.center;

      this.parallax.x += (this.parallax.tx - this.parallax.x) * 0.05;
      this.parallax.y += (this.parallax.ty - this.parallax.y) * 0.05;
      const bias = attn * 0.2;
      camera.position.set(10 + this.parallax.x * 2.4 + fCenter.x * bias * 0.3, 8.5 + this.parallax.y * 1.6 + (fCenter.y - 6) * bias * 0.25, 23 - Math.abs(this.parallax.x) * 0.7);
      camera.lookAt(this.parallax.x * 1.0 + fCenter.x * bias, 6 + this.parallax.y * 0.55 + (fCenter.y - 6) * bias * 0.4, fCenter.z * bias * 0.5);
      camera.rotation.z = this.parallax.x * 0.01;

      hotspots.forEach(h => {
        const active = h.index === this.hoverIndex || h.index === this.openIndex;
        const feat = Math.max(h.index === fIdx ? attn : 0, h.trig);
        const breathe = 0.5 + Math.sin(t * 0.7 + h.index * 1.5) * 0.5;
        // glitching silhouette shimmer — stepped jitter on the back-facing shell
        const gl = h.gl;
        if (t > gl.next) {
          gl.next = t + (active ? 0.1 + Math.random() * 0.12 : feat > 0.3 ? 0.3 + Math.random() * 0.4 : 0.9 + Math.random() * 1.3);
          const amp = active ? 0.11 : 0.03 + feat * 0.05;
          gl.ox = (Math.random() - 0.5) * amp;
          gl.oy = (Math.random() - 0.5) * amp * 0.6;
          gl.s = 1 + (Math.random() - 0.3) * (active ? 0.05 : 0.012 + feat * 0.02);
          gl.o = active ? 0.35 + Math.random() * 0.5 : (h.kind === 'crow' ? 0.12 : 0.04) + feat * 0.42 + Math.random() * 0.06;
          h.outline.material.color.copy(PALE).lerp(h.glow, Math.random() * (active ? 0.75 : 0.4));
        }
        h.outline.position.set(gl.ox, gl.oy, 0);
        h.outline.scale.setScalar(gl.s);
        h.outline.material.opacity = gl.o * (0.8 + breathe * 0.25);
        h.light.intensity = active ? 2.4 : 0.45 + feat * 1.3 + breathe * 0.3;
        h.halo.quaternion.copy(camera.quaternion);
        h.halo.rotateZ(t * (active ? 0.32 : 0.06) + h.index);
        h.halo.mat.opacity = active ? 0.3 : 0.03 + feat * 0.2 + breathe * 0.03;
        // plasma wisp
        const c = h.kind ? h.group.position : h.center;
        for (let i = 0; i < h.WN; i++) {
          const a = (i / h.WN) * Math.PI * 2 + t * (active ? 0.9 : 0.22 + feat * 0.3) + i * 0.03;
          const rr = h.radius * (0.7 + Math.sin(t * 1.4 + i * 0.6) * 0.35);
          h.wpos[i * 3] = c.x + Math.cos(a) * rr;
          h.wpos[i * 3 + 1] = c.y + Math.sin(t * 0.9 + i * 0.35) * h.radius * 0.5 + (active ? 0.4 : 0);
          h.wpos[i * 3 + 2] = c.z + Math.sin(a) * rr;
        }
        h.wgeo.attributes.position.needsUpdate = true;
        h.wisp.material.opacity = active ? 0.5 : 0.07 + feat * 0.3 + breathe * 0.05;
      });

      const flapPhase = Math.sin(t * 10);
      if (!flight.active && t % 14 > 13.4) { flight.active = true; flight.t = 0; }
      if (flight.active) {
        flight.t += 0.016;
        const p = Math.min(1, flight.t / flight.dur);
        const from = flight.at === 'A' ? crow.perchA : crow.perchB;
        const to = flight.at === 'A' ? crow.perchB : crow.perchA;
        crow.group.position.lerpVectors(from, to, p);
        crow.group.position.y += Math.sin(p * Math.PI) * 1.0;
        crow.group.rotation.y = Math.atan2(to.x - from.x, to.z - from.z) * 0.5;
        crow.wingL.rotation.x = flapPhase * 1.15; crow.wingR.rotation.x = -flapPhase * 1.15;
        if (p >= 1) { flight.active = false; flight.at = flight.at === 'A' ? 'B' : 'A'; }
      } else {
        const home = flight.at === 'A' ? crow.perchA : crow.perchB;
        const settle = t % 7 > 6.5;
        crow.group.position.set(home.x, home.y + Math.sin(t * 1.8) * 0.05 + (settle ? Math.abs(flapPhase) * 0.18 : 0), home.z);
        const fl = settle ? flapPhase * 0.8 : -0.1 + Math.sin(t * 2.2) * 0.05;
        crow.wingL.rotation.x = fl; crow.wingR.rotation.x = -fl;
        crow.group.rotation.y = Math.sin(t * 0.5) * 0.4 + (this.hoverIndex === 3 ? 0.6 : 0);
      }
      crow.pick.position.copy(crow.group.position);
      crow.halo.position.copy(crow.group.position);
      crow.light.position.copy(crow.group.position);

      // ---- creature scheduler: one on stage, handing off with a short overlap ----
      const roster = ['squirrel', 'frog', 'lizard', 'scorpion', 'snake'];
      while (sched.list.length < 2) {
        const prev = sched.list[sched.list.length - 1];
        const prevEnd = prev ? prev.start + prev.dur : t + 0.4;
        const avail = roster.filter(k => k !== sched.last);
        const who = avail[Math.floor(Math.random() * avail.length)];
        sched.last = who;
        const pool = canVisit[who];
        sched.list.push({
          who, start: prevEnd - 1.3, dur: 11 + Math.random() * 6,
          target: pool[Math.floor(Math.random() * pool.length)],
        });
      }
      while (sched.list.length && sched.list[0].start + sched.list[0].dur < t) sched.list.shift();
      const showOf = (k) => {
        for (const s of sched.list) if (s.who === k && t >= s.start && t <= s.start + s.dur) return s;
        return null;
      };
      const phase = (k) => { const s = showOf(k); return s ? (t - s.start) / s.dur : -1; };
      // draws the creature toward the form it has come to visit, then releases it
      const approach = (obj, k, p, amt, opts) => {
        const s = showOf(k);
        if (!s) return 0;
        const h = hotspots[s.target];
        const c = h.kind ? h.group.position : h.center;
        const e = Math.sin(Math.min(1, Math.max(0, (p - 0.26) / 0.46)) * Math.PI);
        const y0 = obj.position.y;
        obj.position.lerp(c, e * (amt ?? 0.8));
        const o = opts || {};
        if (o.flat) obj.position.y = y0;                       // ground-bound: never leaves the floor
        else if (o.climb && c.y - y0 > 1.2) obj.rotation.z = o.climbTilt ?? 1.3 * Math.min(1, e * 2);
        return e;
      };

      // squirrel: up out of the litter, along the log, then away up the far trunk
      const sqP = phase('squirrel');
      squirrel.visible = sqP >= 0;
      if (sqP >= 0) {
        if (sqP < 0.18) {
          const p = sqP / 0.18;
          squirrel.position.set(-6 * step, (-2 + p * 5.6) * step, 11 * step);
          squirrel.rotation.set(0, Math.PI * 0.5, 0);
        } else if (sqP < 0.68) {
          const p = (sqP - 0.18) / 0.5;
          squirrel.position.set((-6 + p * 12) * step, 3.6 * step + Math.abs(Math.sin(p * 26)) * 0.16, (11 - p) * step);
          squirrel.rotation.set(0, Math.PI * 0.5, Math.sin(p * 26) * 0.12);
        } else {
          const p = (sqP - 0.68) / 0.32;
          squirrel.position.set(18 * step - 1.15, (3 + p * 30) * step, -12 * step + 1.35);
          squirrel.rotation.set(0, 0, 0.28 + Math.sin(p * 40) * 0.14);
        }
        approach(squirrel, 'squirrel', sqP, 0.8, { climb: true });
      }

      // ---- scene loop: a 26s cycle of scheduled ambient events ----
      const cycle = t % 26;
      // frog: hops in from the undergrowth, croaks by the spring, hops out
      const frP = phase('frog');
      frog.visible = frP >= 0;
      frogLight.intensity = 0;
      if (frP >= 0) {
        const frOut = new THREE.Vector3(frogA.x + 9, frogA.y, frogA.z + 7);
        let from = frogA, to = frogB, seg = 0;
        if (frP < 0.2) { from = frOut; to = frogA; seg = frP / 0.2; }
        else if (frP < 0.8) {
          const inner = (frP - 0.2) / 0.6, hops = 3;
          const hi = Math.floor(inner * hops), hf = (inner * hops) % 1;
          from = hi % 2 === 0 ? frogA : frogB; to = hi % 2 === 0 ? frogB : frogA; seg = hf;
        } else { from = frogB; to = frOut; seg = (frP - 0.8) / 0.2; }
        if (seg < 0.35) {
          const p = seg / 0.35;
          frog.position.lerpVectors(from, to, p);
          frog.position.y = from.y + Math.sin(p * Math.PI) * 1.1;
          frog.rotation.y = Math.atan2(to.x - from.x, to.z - from.z);
          frog.scale.set(1, 1 - Math.sin(p * Math.PI) * 0.12, 1);
        } else {
          frog.position.copy(to);
          const croak = Math.max(0, Math.sin((seg - 0.35) * 12));
          frog.scale.set(1 + croak * 0.14, 1 - croak * 0.06, 1 + croak * 0.14);
        }
        approach(frog, 'frog', frP, 0.7, { flat: true });
        frogLight.position.copy(frog.position);
        frogLight.intensity = 0.3 + Math.abs(Math.sin(t * 2.2)) * 0.45;
      }

      // pulse sweeps across the clearing every cycle, then rests
      if (cycle < 9) {
        const p = cycle / 9;
        pulse.position.set(-26 + p * 52, 1.6 + Math.sin(p * Math.PI * 2) * 0.8, 6 - p * 14);
        pulse.intensity = Math.sin(p * Math.PI) * 2.6;
      } else pulse.intensity = 0;

      // lizard: emerges from a crack in the rock, darts, retreats
      const lzP = phase('lizard');
      lizard.visible = lzP >= 0;
      if (lzP >= 0) {
        const emerge = Math.min(1, lzP / 0.14), retreat = Math.min(1, Math.max(0, (lzP - 0.86) / 0.14));
        const lzStops = [[19, 4.2, -4], [23, 4.2, 0], [20, 4.2, 2]];
        const inner = Math.min(0.999, Math.max(0, (lzP - 0.14) / 0.72));
        const li = Math.floor(inner * 3), lnext = (li + 1) % 3, lp = (inner * 3) % 1;
        const dart = Math.min(1, lp / 0.22);
        const a0 = lzStops[li], a1 = lzStops[lnext];
        lizard.position.set(
          (a0[0] + (a1[0] - a0[0]) * dart) * step,
          (a0[1] + Math.sin(dart * Math.PI) * 0.5) * step,
          (a0[2] + (a1[2] - a0[2]) * dart) * step
        );
        lizard.rotation.y = Math.atan2(a1[0] - a0[0], a1[2] - a0[2]);
        lizard.rotation.z = dart < 1 ? Math.sin(t * 22) * 0.08 : Math.sin(t * 1.5) * 0.02;
        approach(lizard, 'lizard', lzP, 0.8, { climb: true, climbTilt: 1.45 });
        lizard.scale.setScalar(Math.max(0.02, emerge * (1 - retreat)));
      }

      // scorpion: crawls in from the left, crosses the litter, exits right
      const scP = phase('scorpion');
      scorpion.visible = scP >= 0;
      if (scP >= 0) {
        const x = -34 + scP * 68;
        scorpion.position.set(x * step, 2.4 * step, (13 + Math.sin(scP * Math.PI * 2) * 3) * step);
        scorpion.rotation.y = Math.PI / 2 + Math.cos(scP * Math.PI * 2) * 0.3;
        scorpion.rotation.z = Math.sin(t * 6) * 0.05;
        approach(scorpion, 'scorpion', scP, 0.8, { climb: true, climbTilt: 1.1 });
      }

      // snake: slithers in from the right and away to the left
      const snP = phase('snake');
      snake.visible = snP >= 0;
      if (snP >= 0) {
        const head = 36 - snP * 74;
        // the whole body eases toward the form the snake has come to visit
        const sShow = showOf('snake');
        const sEnv = Math.sin(Math.min(1, Math.max(0, (snP - 0.26) / 0.46)) * Math.PI) * 0.8;
        const sTarget = sShow ? (hotspots[sShow.target].kind ? hotspots[sShow.target].group.position : hotspots[sShow.target].center) : null;
        for (let i = 0; i < SEG; i++) {
          const u = i * 1.5;
          const sx = head + u;
          const sz = 17 + Math.sin((sx + t * 6) * 0.18) * 3.0;
          const taper = 1 - (i / SEG) * 0.55;
          const groundY = (1.2 + Math.abs(Math.sin(u * 0.6 + t * 3)) * 0.18) * step;
          snakeDummy.position.set(sx * step, groundY, sz * step);
          if (sTarget) { snakeDummy.position.lerp(sTarget, sEnv * (1 - i / (SEG * 1.6))); snakeDummy.position.y = groundY; }
          snakeDummy.rotation.set(0, Math.cos((sx + t * 6) * 0.18) * 0.7, 0);
          snakeDummy.scale.setScalar(taper);
          snakeDummy.updateMatrix();
          snake.setMatrixAt(i, snakeDummy.matrix);
          if (i === 0) snakeHead.copy(snakeDummy.position);
        }
        snake.instanceMatrix.needsUpdate = true;
      }

      // ---- creature meets a form: accent plasma, smoke and geometry flare ----
      const visitors = [];
      if (squirrel.visible) visitors.push(squirrel.position);
      if (frog.visible) visitors.push(frog.position);
      if (lizard.visible) visitors.push(lizard.position);
      if (scorpion.visible) visitors.push(scorpion.position);
      if (snake.visible) visitors.push(snakeHead);
      hotspots.forEach(h => { h.trig *= 0.955; });
      visitors.forEach(vp => hotspots.forEach(h => {
        const c = h.kind ? h.group.position : h.center;
        if (vp.distanceTo(c) > h.radius + 2.6) return;
        h.trig = 1;
        if (t - h.lastTouch > 0.07) {
          h.lastTouch = t;
          for (let k = 0; k < 7; k++) {
            const v = new THREE.Vector3(Math.random() - 0.5, Math.random() * 0.9, Math.random() - 0.5).normalize().multiplyScalar(0.8 + Math.random() * 1.6);
            this.bursts.push({ p: vp.clone().lerp(c, 0.35 + Math.random() * 0.4), v, life: 1, c: h.glow });
          }
          // a puff of accent smoke rises off the contact
          for (let k = 0; k < 3; k++) {
            const si = Math.floor(Math.random() * SM);
            smpos[si * 3] = c.x + (Math.random() - 0.5) * 1.6;
            smpos[si * 3 + 1] = c.y;
            smpos[si * 3 + 2] = c.z + (Math.random() - 0.5) * 1.6;
          }
        }
      }));

      // link the moving creatures to the featured form
      const movers = [crow.group.position].concat(visitors);
      for (let i = 0; i < 3; i++) {
        const mp = movers[i];
        if (mp) {
          linkPos[i * 6] = mp.x; linkPos[i * 6 + 1] = mp.y; linkPos[i * 6 + 2] = mp.z;
          linkPos[i * 6 + 3] = fCenter.x; linkPos[i * 6 + 4] = fCenter.y; linkPos[i * 6 + 5] = fCenter.z;
        } else {
          for (let k = 0; k < 6; k++) linkPos[i * 6 + k] = 0;
        }
      }
      linkGeo.attributes.position.needsUpdate = true;
      linkMat.opacity = (0.03 + attn * 0.09) * (0.6 + Math.abs(Math.sin(t * 0.8)) * 0.4);

      if (this.hoverIndex >= 0 && t - lastEmit > 0.05) {
        lastEmit = t;
        const h = hotspots[this.hoverIndex];
        const src = h.kind ? h.group.position : h.center;
        for (let k = 0; k < 8; k++) {
          const v = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize().multiplyScalar(1 + Math.random() * 1.8);
          this.bursts.push({ p: src.clone(), v, life: 1, c: PALE });
        }
      }
      this.bursts = this.bursts.filter(b => b.life > 0);
      if (this.bursts.length > MAX) this.bursts.splice(0, this.bursts.length - MAX);
      for (let i = 0; i < MAX; i++) {
        const b = this.bursts[i];
        if (!b) { bpos[i * 3 + 1] = 9999; continue; }
        b.life -= 0.016;
        b.p.addScaledVector(b.v, 0.016);
        b.v.multiplyScalar(0.97); b.v.y += 0.012;
        bpos[i * 3] = b.p.x; bpos[i * 3 + 1] = b.p.y; bpos[i * 3 + 2] = b.p.z;
        const col = b.c || PALE, f = Math.max(0, b.life);
        bcol[i * 3] = col.r * f; bcol[i * 3 + 1] = col.g * f; bcol[i * 3 + 2] = col.b * f;
      }
      bgeo.attributes.position.needsUpdate = true;
      bgeo.attributes.color.needsUpdate = true;

      for (let i = 0; i < SP; i++) {
        spos[i * 3 + 1] += 0.004 + (i % 4) * 0.001;
        spos[i * 3] += Math.sin(t * 0.4 + i) * 0.002;
        if (spos[i * 3 + 1] > 16) spos[i * 3 + 1] = 0;
      }
      sgeo.attributes.position.needsUpdate = true;
      for (let i = 0; i < SM; i++) {
        smpos[i * 3] += Math.sin(t * 0.16 + i) * 0.006;
        smpos[i * 3 + 1] += 0.0035;
        smpos[i * 3 + 2] += Math.cos(t * 0.13 + i * 0.7) * 0.004;
        if (smpos[i * 3 + 1] > 13) smpos[i * 3 + 1] = 0;
      }
      smgeo.attributes.position.needsUpdate = true;
      smmat.opacity = 0.07 + Math.sin(t * 0.35) * 0.03;
      shmat.opacity = 0.12 + Math.abs(Math.sin(t * 0.55)) * 0.16;

      if (this.net) this.drawNet(t);
      renderer.render(scene, camera);
    };
    loop();
  }

  bindPointer(canvas, THREE) {
    const ndc = new THREE.Vector2();
    let lastPos = null;
    // hit the actual voxel bodies, so only the forms themselves respond
    const targets = [];
    this.three.hotspots.forEach(h => h.targets.forEach(m => targets.push(m)));
    const pick = (e) => {
      const r = canvas.getBoundingClientRect();
      ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      this.raycaster.setFromCamera(ndc, this.three.camera);
      const hits = this.raycaster.intersectObjects(targets, false);
      return hits.length ? hits[0].object.userData.hsIndex : -1;
    };
    canvas.addEventListener('pointermove', (e) => {
      const r = canvas.getBoundingClientRect();
      this.parallax.tx = ((e.clientX - r.left) / r.width) * 2 - 1;
      this.parallax.ty = -(((e.clientY - r.top) / r.height) * 2 - 1);
      const now = performance.now();
      if (lastPos) {
        const d = Math.hypot(e.clientX - lastPos.x, e.clientY - lastPos.y);
        if (d > 42 && now - this.lastMicro > 520) { this.lastMicro = now; this.glitch(120, true); }
      }
      lastPos = { x: e.clientX, y: e.clientY };
      if (this.openIndex >= 0) return;
      if (now - (this.lastPick || 0) < 55) return;
      this.lastPick = now;
      const idx = pick(e);
      if (idx !== this.hoverIndex) {
        this.hoverIndex = idx;
        if (idx >= 0) this.glitch(200);
        this.setState({ hoverIndex: idx });
      }
    });
    canvas.addEventListener('pointerdown', (e) => {
      if (this.openIndex >= 0) return;
      const idx = pick(e);
      if (idx < 0) return;
      this.openIndex = idx; this.hoverIndex = -1;
      this.found.add(idx);
      this.glitch(380);
      this.setState({ openIndex: idx, hoverIndex: -1, found: [...this.found] });
    });
    canvas.addEventListener('pointerleave', () => {
      this.parallax.tx = 0; this.parallax.ty = 0;
      if (this.hoverIndex !== -1) { this.hoverIndex = -1; this.setState({ hoverIndex: -1 }); }
    });
  }

  closeModal() {
    this.openIndex = -1; this.net = null;
    this.glitch(260);
    this.setState({ openIndex: -1 });
  }

  initNet() {
    const c = this.netCanvasRef.current;
    if (!c) return;
    const w = c.clientWidth, h = c.clientHeight;
    c.width = w; c.height = h;
    const pts = [];
    for (let i = 0; i < 66; i++) pts.push({ x: Math.random() * w, y: Math.random() * h, vx: (Math.random() - 0.5) * 0.32, vy: (Math.random() - 0.5) * 0.32 });
    const spores = [];
    for (let i = 0; i < 90; i++) spores.push({ u: Math.random(), r: Math.random(), s: 0.02 + Math.random() * 0.05, ph: Math.random() * 6.28 });
    const blobs = [];
    for (let i = 0; i < 5; i++) blobs.push({ ph: Math.random() * 6.28, sp: 0.1 + Math.random() * 0.16, r: 90 + Math.random() * 120 });
    // every opening grows its own mycelial network outside the panel
    const growth = [];
    const GN = 11 + Math.floor(Math.random() * 9);
    for (let i = 0; i < GN; i++) growth.push({
      th: (i / GN) * Math.PI * 2 + (Math.random() - 0.5) * 0.4,
      seed: Math.random() * 40,
      len: 22 + Math.random() * 40,
      depth: 2 + Math.floor(Math.random() * 3),
      delay: Math.random() * 0.55,
      spread: 0.4 + Math.random() * 0.6,
      rate: 0.25 + Math.random() * 0.5,
    });
    const P = (1 + Math.sqrt(5)) / 2;
    const verts = [[-1, P, 0], [1, P, 0], [-1, -P, 0], [1, -P, 0], [0, -1, P], [0, 1, P], [0, -1, -P], [0, 1, -P], [P, 0, -1], [P, 0, 1], [-P, 0, -1], [-P, 0, 1], [0, 0, 0]];
    // radials: creep out from behind the panel, reach the membrane, then run around it
    const radials = [];
    const RN = 7 + Math.floor(Math.random() * 5);
    for (let i = 0; i < RN; i++) radials.push({
      th: (i / RN) * Math.PI * 2 + (Math.random() - 0.5) * 0.5,
      len: 46 + Math.random() * 70,
      delay: 0.3 + Math.random() * 2.2,
      dur: 1.4 + Math.random() * 1.6,
      arcDur: 2.5 + Math.random() * 3.5,
      span: 0.5 + Math.random() * 1.1,
      seed: Math.random() * 30,
    });
    this.net = { c, ctx: c.getContext('2d'), pts, spores, blobs, growth, radials, w, h, verts, motif: this.state.openIndex % 3, t0: null };
  }

  // parametric squircle around the panel — the organic frame's spine
  framePoint(n, th, t, extra) {
    const { w, h } = n;
    const M = 118, p = 5;
    const cx = w / 2, cy = h / 2, a = (w - 2 * M) / 2, b = (h - 2 * M) / 2;
    const c = Math.cos(th), s = Math.sin(th);
    const ux = Math.sign(c) * Math.pow(Math.abs(c), 2 / p);
    const uy = Math.sign(s) * Math.pow(Math.abs(s), 2 / p);
    const wob = 1 + 0.03 * Math.sin(3 * th + t * 0.5) + 0.022 * Math.sin(7 * th - t * 0.35) + 0.014 * Math.sin(11 * th + t * 0.8);
    const off = 15 + 9 * Math.sin(5 * th - t * 0.45) + (extra || 0);
    return { x: cx + (a * wob + off) * ux, y: cy + (b * wob + off) * uy, nx: ux, ny: uy };
  }

  // one mycelial strand: irregular growth, junction nodes, and a path for pulses
  tendril(ctx, x, y, ang, len, depth, k, t, alpha, spread, out) {
    if (depth <= 0 || len < 3) return;
    const seg = 5, sway = Math.sin(t * 0.5 + k * 1.7 + depth) * 0.16;
    let px = x, py = y, a = ang;
    ctx.beginPath();
    ctx.moveTo(px, py);
    for (let i = 0; i < seg; i++) {
      a += sway * 0.5 + Math.sin(k * 3.1 + i * 2.3) * 0.2 * spread;
      px += Math.cos(a) * (len / seg);
      py += Math.sin(a) * (len / seg);
      ctx.lineTo(px, py);
      if (out) out.push([px, py]);
    }
    ctx.strokeStyle = `rgba(159,211,174,${alpha})`;
    ctx.lineWidth = Math.max(0.5, depth * 0.55);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(px, py, 1.1 + depth * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(207,255,220,${alpha * 0.85})`;
    ctx.fill();
    const branches = Math.sin(k * 5.7) > -0.2 ? 2 : 1;
    this.tendril(ctx, px, py, a + 0.5 + spread * 0.35, len * (0.52 + spread * 0.14), depth - 1, k + 1.3, t, alpha * 0.72, spread, out);
    if (branches === 2) this.tendril(ctx, px, py, a - 0.45 - spread * 0.3, len * (0.48 + spread * 0.16), depth - 1, k + 2.7, t, alpha * 0.66, spread, null);
  }

  drawNet(t) {
    const n = this.net;
    if (!n || !n.c.isConnected) { this.net = null; return; }
    const { ctx, pts, spores, blobs, w, h, verts, motif } = n;
    if (n.t0 === null) n.t0 = t;
    const age = Math.min(1, (t - n.t0) / 1.1);
    ctx.clearRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2;

    // drifting plasma light
    blobs.forEach((b, i) => {
      const bx = cx + Math.cos(t * b.sp + b.ph) * (w * 0.42);
      const by = cy + Math.sin(t * b.sp * 1.3 + b.ph) * (h * 0.44);
      const g = ctx.createRadialGradient(bx, by, 0, bx, by, b.r);
      g.addColorStop(0, i % 2 ? 'rgba(95,158,160,0.07)' : 'rgba(159,211,174,0.055)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.fillRect(bx - b.r, by - b.r, b.r * 2, b.r * 2);
    });

    ctx.lineWidth = 1;
    const R = Math.min(w, h) * 0.16, spin = t * 0.1;
    ctx.strokeStyle = 'rgba(159,211,174,0.09)';
    if (motif === 0) {
      for (let i = 0; i < 7; i++) {
        const a = spin + (i / 6) * Math.PI * 2;
        const ox = i === 0 ? 0 : Math.cos(a) * R, oy = i === 0 ? 0 : Math.sin(a) * R;
        ctx.beginPath(); ctx.arc(cx + ox, cy + oy, R, 0, Math.PI * 2); ctx.stroke();
      }
    } else if (motif === 1) {
      for (let k = 0; k < 4; k++) {
        ctx.beginPath();
        for (let i = 0; i <= 3; i++) { const a = spin * (k % 2 ? -1 : 1) + (i / 3) * Math.PI * 2 + (k < 2 ? 0 : Math.PI); const rr = R * (1.4 - k * 0.22); const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
        ctx.stroke();
      }
    } else {
      ctx.beginPath();
      for (let i = 0; i <= 260; i++) { const a = (i / 260) * Math.PI * 6; const rr = R * 0.12 * Math.exp(0.2 * a); if (rr > R * 1.9) break; const x = cx + Math.cos(a + spin) * rr, y = cy + Math.sin(a + spin) * rr; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.stroke();
    }

    const ry = t * 0.5, rx = t * 0.28, s = Math.min(w, h) * 0.11;
    const proj = verts.map(v => {
      const [x, y, z] = v;
      const x1 = x * Math.cos(ry) - z * Math.sin(ry), z1 = x * Math.sin(ry) + z * Math.cos(ry);
      const y1 = y * Math.cos(rx) - z1 * Math.sin(rx), z2 = y * Math.sin(rx) + z1 * Math.cos(rx);
      const persp = 3.4 / (3.4 + z2 * 0.42);
      return { x: cx + x1 * s * persp, y: cy + y1 * s * persp };
    });
    for (let i = 0; i < proj.length; i++) for (let j = i + 1; j < proj.length; j++) {
      const d = Math.hypot(proj[i].x - proj[j].x, proj[i].y - proj[j].y);
      if (d > s * 2.3) continue;
      ctx.strokeStyle = `rgba(95,158,160,${0.07 + (1 - d / (s * 2.3)) * 0.2})`;
      ctx.beginPath(); ctx.moveTo(proj[i].x, proj[i].y); ctx.lineTo(proj[j].x, proj[j].y); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(228,255,238,0.7)';
    proj.forEach(p => ctx.fillRect(Math.round(p.x) - 1, Math.round(p.y) - 1, 2, 2));

    pts.forEach(p => {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > w) p.vx *= -1;
      if (p.y < 0 || p.y > h) p.vy *= -1;
    });
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
      if (d > 118) continue;
      ctx.strokeStyle = `rgba(159,211,174,${(1 - d / 118) * 0.2})`;
      ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(159,211,174,0.5)';
    pts.forEach(p => ctx.fillRect(Math.round(p.x) - 1, Math.round(p.y) - 1, 2, 2));

    // keep the reading area clear — punch the panel footprint out of everything drawn so far
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.beginPath();
    for (let i = 0; i <= 200; i++) {
      const f = this.framePoint(n, (i / 200) * Math.PI * 2, t, -16);
      i ? ctx.lineTo(f.x, f.y) : ctx.moveTo(f.x, f.y);
    }
    ctx.closePath();
    ctx.fillStyle = '#000';
    ctx.fill();
    ctx.restore();

    // ---- organic frame: a living membrane that grows in around the panel ----
    const N = 220, upto = Math.floor(N * age);
    ctx.beginPath();
    for (let i = 0; i <= upto; i++) {
      const f = this.framePoint(n, (i / N) * Math.PI * 2, t);
      i ? ctx.lineTo(f.x, f.y) : ctx.moveTo(f.x, f.y);
    }
    if (age >= 1) ctx.closePath();
    ctx.strokeStyle = 'rgba(95,158,160,0.3)';
    ctx.lineWidth = 4.5;
    ctx.stroke();
    ctx.strokeStyle = 'rgba(207,255,220,0.62)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
    // inner echo line
    ctx.beginPath();
    for (let i = 0; i <= upto; i++) {
      const f = this.framePoint(n, (i / N) * Math.PI * 2, t + 1.7, -9);
      i ? ctx.lineTo(f.x, f.y) : ctx.moveTo(f.x, f.y);
    }
    ctx.strokeStyle = 'rgba(159,211,174,0.16)';
    ctx.lineWidth = 0.8;
    ctx.stroke();

    // radial growth: out from behind the panel to the membrane, then spreading around it
    const el = t - n.t0;
    n.radials.forEach((r, k) => {
      const gp = Math.min(1, Math.max(0, (el - r.delay) / r.dur));
      if (gp <= 0) return;
      const steps = 16;
      ctx.beginPath();
      for (let i = 0; i <= steps; i++) {
        const u = i / steps;
        const off = -8 + r.len * gp * u;
        const th = r.th + Math.sin(u * 3.2 + r.seed) * 0.045 + Math.sin(t * 0.3 + r.seed) * 0.012;
        const f = this.framePoint(n, th, t, off);
        i ? ctx.lineTo(f.x, f.y) : ctx.moveTo(f.x, f.y);
      }
      ctx.strokeStyle = `rgba(159,211,174,${0.1 + gp * 0.22})`;
      ctx.lineWidth = 1.5 - gp * 0.5;
      ctx.stroke();
      const tip = this.framePoint(n, r.th, t, -8 + r.len * gp);
      ctx.beginPath(); ctx.arc(tip.x, tip.y, 1.6, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(207,255,220,${0.3 + gp * 0.45})`; ctx.fill();
      if (gp >= 1) {
        const mid = this.framePoint(n, r.th + 0.05, t, -8 + r.len * 0.55);
        this.tendril(ctx, mid.x, mid.y, Math.atan2(mid.ny, mid.nx) + 1.1, 16, 2, r.seed + 7, t, 0.16, 0.8, null);
        // then it runs around the perimeter in both directions
        const ap = Math.min(1, Math.max(0, (el - r.delay - r.dur) / r.arcDur));
        [1, -1].forEach(dir => {
          const span = r.span * ap * (dir > 0 ? 1 : 0.8);
          if (span < 0.02) return;
          ctx.beginPath();
          const seg = 26;
          for (let i = 0; i <= seg; i++) {
            const s = (i / seg) * span;
            const f = this.framePoint(n, r.th + dir * s, t, r.len - 8 - Math.sin(s * 2.4) * 6);
            i ? ctx.lineTo(f.x, f.y) : ctx.moveTo(f.x, f.y);
          }
          ctx.strokeStyle = `rgba(95,158,160,${0.08 + ap * 0.2})`;
          ctx.lineWidth = 1;
          ctx.stroke();
          const end = this.framePoint(n, r.th + dir * span, t, r.len - 8 - Math.sin(span * 2.4) * 6);
          ctx.beginPath(); ctx.arc(end.x, end.y, 1.4, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(207,255,220,${0.2 + ap * 0.4})`; ctx.fill();
          if (ap > 0.35) this.tendril(ctx, end.x, end.y, Math.atan2(end.ny, end.nx) + dir * 0.6, 14 * ap, 2, r.seed + dir * 3, t, 0.14 * ap, 0.9, null);
        });
      }
    });

    // randomized mycelium / slime-mold growth creeping outward, with pulses running along it
    n.growth.forEach((g, k) => {
      const grow = Math.max(0, Math.min(1, (age - g.delay) / (1 - g.delay))) * (0.6 + 0.4 * Math.sin(t * g.rate + k * 1.9));
      if (grow <= 0.03) return;
      const f = this.framePoint(n, g.th, t);
      const path = [];
      this.tendril(ctx, f.x, f.y, Math.atan2(f.ny, f.nx), g.len * grow, g.depth, g.seed, t, 0.26 * grow + 0.07, g.spread, path);
      if (path.length) {
        const u = (t * (0.13 + g.rate * 0.1) + g.seed) % 1;
        const p = path[Math.floor(u * (path.length - 1))];
        const al = Math.sin(u * Math.PI) * 0.75 * grow;
        ctx.beginPath();
        ctx.arc(p[0], p[1], 1.8, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(207,255,220,${al})`;
        ctx.fill();
      }
    });

    // spores riding the membrane
    spores.forEach((s, i) => {
      s.u = (s.u + s.s * 0.004) % 1;
      const f = this.framePoint(n, s.u * Math.PI * 2, t, 6 + s.r * 26 * Math.sin(t * 0.5 + s.ph) ** 2);
      const al = (0.2 + 0.55 * Math.abs(Math.sin(t * 1.1 + s.ph))) * age;
      ctx.fillStyle = i % 4 === 0 ? `rgba(95,158,160,${al})` : `rgba(207,255,220,${al * 0.75})`;
      const sz = i % 7 === 0 ? 2 : 1;
      ctx.fillRect(Math.round(f.x), Math.round(f.y), sz, sz);
    });
  }

  onResize() {
    if (!this.three) return;
    const c = this.canvasRef.current;
    this.three.camera.aspect = c.clientWidth / c.clientHeight;
    this.three.camera.updateProjectionMatrix();
    this.three.renderer.setSize(c.clientWidth, c.clientHeight, false);
  }

  renderVals() {
    const open = this.state.openIndex >= 0 ? this.sections[this.state.openIndex] : this.sections[0];
    return {
      canvasRef: this.canvasRef,
      glitchWrapRef: this.glitchWrapRef,
      netCanvasRef: this.netCanvasRef,
      cursor: this.state.hoverIndex >= 0 ? 'pointer' : 'crosshair',
      marks: this.sections.map((_, i) => ({ bg: this.state.found.includes(i) ? 'rgba(159,211,174,0.85)' : 'rgba(159,211,174,0.14)' })),
      hint: this.state.hoverIndex >= 0 ? '◆' : (this.state.found.length >= 5 ? '' : '· · ·'),
      isOpen: this.state.openIndex >= 0,
      open: { ...open, hasChips: open.chips.length > 0 },
      closeModal: () => this.closeModal(),
    };
  }
}

</script>
