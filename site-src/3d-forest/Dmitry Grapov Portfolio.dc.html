<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="omelette-owns-print" content="false">
  <script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    @keyframes dg-blink { 0%,45%{opacity:1} 50%,95%{opacity:0} 100%{opacity:1} }
    @keyframes dg-fade-up { from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:translateY(0)} }
    html,body{margin:0;padding:0;background:#05090a;overscroll-behavior:none}
    ::selection{background:rgba(94,234,212,0.35);color:#eafff6}
    a{color:#8CF29B}
    a:hover{color:#5EEAD4}
  </style>
</helmet>
<div style="position:relative;width:100%;background:#05090a;font-family:'IBM Plex Sans',sans-serif;color:#dff5ee;height:{{ scrollSpacerHeight }}px">

  <div style="position:fixed;inset:0;z-index:0;overflow:hidden">
    <canvas ref="{{ canvasRef }}" style="width:100%;height:100%;display:block"></canvas>
    <div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(5,9,10,0.75) 100%)"></div>
    <div style="position:absolute;inset:0;pointer-events:none;opacity:0.05;background:repeating-linear-gradient(0deg, #eafff6 0px, transparent 1px, transparent 2px, #eafff6 3px)"></div>
  </div>

  <div style="position:fixed;top:28px;left:32px;z-index:5;font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.14em;color:#8CF29B;display:flex;align-items:center;gap:2px">
    DMITRY_GRAPOV<span style="animation:dg-blink 1.1s step-end infinite;color:#5EEAD4">_</span>
  </div>

  <div style="position:fixed;top:28px;right:32px;z-index:5;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.1em;color:rgba(223,245,238,0.45)">
    DIGITAL FOOD FOREST — v1
  </div>

  <div style="position:fixed;right:28px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:18px;align-items:flex-end">
    <sc-for list="{{ dots }}" as="dot" hint-placeholder-count="6">
      <button onClick="{{ dot.go }}" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;justify-content:flex-end;group:1">
        <span style="font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.08em;color:{{ dot.labelColor }};transition:color 320ms ease;white-space:nowrap">{{ dot.label }}</span>
        <span style="width:7px;height:7px;border-radius:50%;background:{{ dot.dotColor }};box-shadow:{{ dot.dotShadow }};transition:all 320ms ease;display:block"></span>
      </button>
    </sc-for>
  </div>

  <div style="position:fixed;left:0;right:0;bottom:0;top:0;z-index:4;display:flex;align-items:center;justify-content:center;pointer-events:none;padding:0 32px">
    <div style="max-width:640px;width:100%;pointer-events:auto;opacity:{{ panelOpacity }};transform:{{ panelTransform }};transition:opacity 260ms ease,transform 260ms ease">

      <sc-if value="{{ isHero }}" hint-placeholder-val="{{ false }}">
        <div style="text-align:center">
          <div style="font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.28em;color:#5EEAD4;margin-bottom:22px">{{ current.kicker }}</div>
          <div style="font-family:'IBM Plex Sans',sans-serif;font-weight:300;font-size:clamp(30px,4.4vw,52px);line-height:1.15;color:#eafff6;margin-bottom:20px;text-wrap:pretty">{{ current.title }}</div>
          <div style="font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.05em;color:rgba(223,245,238,0.55)">{{ current.body }}</div>
          <div style="margin-top:56px;font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:0.2em;color:rgba(140,242,155,0.6)">↓ SCROLL TO WALK THE GARDEN ↓</div>
        </div>
      </sc-if>

      <sc-if value="{{ isNotHero }}" hint-placeholder-val="{{ true }}">
        <div style="background:rgba(8,20,18,0.5);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(124,252,138,0.28);border-radius:10px;padding:40px 44px;box-shadow:0 0 40px rgba(94,234,212,0.08), inset 0 0 60px rgba(94,234,212,0.03)">
          <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.26em;color:#5EEAD4;margin-bottom:16px">{{ current.kicker }}</div>
          <div style="font-family:'IBM Plex Sans',sans-serif;font-weight:400;font-size:clamp(24px,2.8vw,34px);line-height:1.2;color:#eafff6;margin-bottom:16px">{{ current.title }}</div>
          <div style="font-family:'IBM Plex Sans',sans-serif;font-weight:300;font-size:16px;line-height:1.65;color:rgba(223,245,238,0.78);text-wrap:pretty;margin-bottom:{{ current.bottomMargin }}px">{{ current.body }}</div>

          <sc-if value="{{ current.hasChips }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px">
              <sc-for list="{{ current.chips }}" as="chip" hint-placeholder-count="4">
                <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.03em;color:#8CF29B;border:1px solid rgba(140,242,155,0.35);border-radius:999px;padding:5px 12px">{{ chip }}</span>
              </sc-for>
            </div>
          </sc-if>

          <div style="display:flex;flex-wrap:wrap;gap:24px">
            <sc-for list="{{ current.links }}" as="link" hint-placeholder-count="2">
              <a href="{{ link.url }}" target="_blank" rel="noopener" style="font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:0.03em;color:#8CF29B;text-decoration:none;border-bottom:1px solid rgba(140,242,155,0.4);padding-bottom:2px">{{ link.label }}</a>
            </sc-for>
          </div>
        </div>
      </sc-if>

    </div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: {},
  &quot;particleDensity&quot;: {&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:500,&quot;min&quot;:150,&quot;max&quot;:1200,&quot;step&quot;:50,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Garden&quot;},
  &quot;pathCurviness&quot;: {&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.3,&quot;max&quot;:2,&quot;step&quot;:0.1,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Garden&quot;},
  &quot;glowPalette&quot;: {&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:[&quot;#5EEAD4&quot;,&quot;#8CF29B&quot;],&quot;tsType&quot;:&quot;string[]&quot;,&quot;section&quot;:&quot;Garden&quot;}
}">
class Component extends DCLogic {
  state = { activeIndex: 0, panelOpacity: 1 };

  sections = [
    { navLabel:'00 · SEED', kicker:'DMITRY GRAPOV', title:'A digital food forest of code, data & wonder.', body:'Scroll to walk the garden.', links:[], chips:[] },
    { navLabel:'01 · ROOTS', kicker:'ROOTS', title:'Cultivating signal from noise', body:"Ph.D. in agricultural & environmental chemistry, and over fifteen years turning high-dimensional biology into human-readable signal. I founded Creative Data Solutions to bring data science out of the black box. Off the clock I'm trail running, mountain biking, or tending an off-grid farm — same principles, patience and feedback loops, grown into food instead of models.", links:[{label:'LinkedIn ↗', url:'https://www.linkedin.com/in/dmitrygrapov/'}], chips:[] },
    { navLabel:'02 · CANOPY', kicker:'THE CANOPY', title:'Code & Science', body:'Metabolomics, network analysis, and machine learning pipelines grown into open tools — pathway-independent network mapping, multivariate analysis, and the software that makes messy Omics data legible.', links:[{label:'View repos ↗', url:'https://github.com/dgrapov'},{label:'Google Scholar ↗', url:'https://scholar.google.com/citations?user=zfp5U0QAAAAJ&hl=en'}], chips:['MetaMapR','DeviumWeb','networkly','CTSgetR','imDEV'] },
    { navLabel:'03 · MYCELIUM', kicker:'MYCELIUM', title:'Teaching & Talks', body:'Knowledge spreads best root to root. Workshops, conference talks, and open tutorials on multivariate analysis, gene ontology, and network biology.', links:[{label:'Teaching demos ↗', url:'https://github.com/dgrapov/TeachingDemos'},{label:'Slides ↗', url:'https://www.slideshare.net/dgrapov'},{label:'Videos ↗', url:'https://www.youtube.com/user/dgrapov/videos'}], chips:[] },
    { navLabel:'04 · GROWTH', kicker:'WILD GROWTH', title:'Writing & Art', body:"Field notes on data science, R, and machine learning — and the parts of me that don't fit in a dataframe.", links:[{label:'Read the blog ↗', url:'https://creativedatasolutions.github.io/cds.blog/'},{label:'See the art ↗', url:'https://www.flickr.com/people/dgrapov/'}], chips:[] },
    { navLabel:'05 · GRAFT', kicker:'GRAFT A BRANCH', title:"Let's grow something", body:'Reach out for collaboration, consulting, or to talk network graphs and trail routes.', links:[{label:'Email ↗', url:'mailto:dmitry@creative-data.solutions'},{label:'LinkedIn ↗', url:'https://www.linkedin.com/in/dmitrygrapov/'},{label:'GitHub ↗', url:'https://github.com/dgrapov'}], chips:[] },
  ];

  canvasRef = React.createRef();
  scrollProgress = 0;
  activeIndexInstance = 0;
  three = null;

  componentDidMount() {
    this.setupScene();
    this.onScroll = this.onScroll.bind(this);
    this.onResize = this.onResize.bind(this);
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('resize', this.onResize);
    this.onScroll();
  }

  componentWillUnmount() {
    window.removeEventListener('scroll', this.onScroll);
    window.removeEventListener('resize', this.onResize);
    if (this.rafId) cancelAnimationFrame(this.rafId);
    if (this.three) {
      this.three.renderer.dispose();
    }
  }

  async setupScene() {
    const THREE = await import('three');
    const canvas = this.canvasRef.current;
    if (!canvas) return;

    const palette = (this.props.glowPalette && this.props.glowPalette.length >= 2) ? this.props.glowPalette : ['#5EEAD4', '#8CF29B'];
    const curviness = this.props.pathCurviness ?? 1;
    const particleCount = Math.round(this.props.particleDensity ?? 500);
    const n = this.sections.length;
    const zStep = 17;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x05090a);
    scene.fog = new THREE.FogExp2(0x05090a, 0.042);

    const camera = new THREE.PerspectiveCamera(55, canvas.clientWidth / canvas.clientHeight, 0.1, 200);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);

    scene.add(new THREE.AmbientLight(0x0d2018, 1.1));
    const hemi = new THREE.HemisphereLight(0x1c3b33, 0x02050a, 0.55);
    scene.add(hemi);

    const waypoints = [];
    for (let i = 0; i < n; i++) {
      waypoints.push(new THREE.Vector3(Math.sin(i * 1.15) * 4.2 * curviness, Math.sin(i * 0.6) * 0.7, -i * zStep));
    }

    const geomFns = [
      () => new THREE.IcosahedronGeometry(1.1, 0),
      () => new THREE.TorusKnotGeometry(0.7, 0.22, 100, 16),
      () => new THREE.OctahedronGeometry(1.15, 0),
      () => new THREE.DodecahedronGeometry(1.05, 0),
      () => new THREE.TetrahedronGeometry(1.2, 0),
    ];

    const nodes = [];
    for (let i = 1; i < n; i++) {
      const side = i % 2 === 0 ? 1 : -1;
      const color = new THREE.Color(i % 2 === 0 ? palette[1] : palette[0]);
      const geo = geomFns[(i - 1) % geomFns.length]();
      const mat = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.55, wireframe: true, transparent: true, opacity: 0.92, roughness: 0.5, metalness: 0.1 });
      const mesh = new THREE.Mesh(geo, mat);
      const pos = waypoints[i].clone().add(new THREE.Vector3(side * 3.4, 0, 2.2));
      mesh.position.copy(pos);
      scene.add(mesh);

      const light = new THREE.PointLight(color, 1.1, 13, 2);
      light.position.copy(pos);
      scene.add(light);

      nodes.push({ mesh, light, index: i, baseIntensity: 0.55 });
    }

    const curve = new THREE.CatmullRomCurve3(waypoints);
    const tubeGeo = new THREE.TubeGeometry(curve, 200, 0.028, 8, false);
    const tubeMat = new THREE.MeshBasicMaterial({ color: new THREE.Color(palette[1]), transparent: true, opacity: 0.3, blending: THREE.AdditiveBlending });
    scene.add(new THREE.Mesh(tubeGeo, tubeMat));

    const totalDepth = n * zStep + 12;
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);
    const c1 = new THREE.Color(palette[0]), c2 = new THREE.Color(palette[1]);
    for (let i = 0; i < particleCount; i++) {
      positions[i * 3] = (Math.random() - 0.5) * 16;
      positions[i * 3 + 1] = (Math.random() - 0.5) * 6;
      positions[i * 3 + 2] = -Math.random() * totalDepth + 4;
      const mixed = c1.clone().lerp(c2, Math.random());
      colors[i * 3] = mixed.r; colors[i * 3 + 1] = mixed.g; colors[i * 3 + 2] = mixed.b;
    }
    const particleGeo = new THREE.BufferGeometry();
    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    const particleMat = new THREE.PointsMaterial({ size: 0.06, vertexColors: true, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false });
    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    this.three = { THREE, scene, camera, renderer, waypoints, nodes, particles, n };

    const clock = new THREE.Clock();
    const animate = () => {
      this.rafId = requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      particles.rotation.y = t * 0.008;

      const frac = this.scrollProgress * (n - 1);
      nodes.forEach(node => {
        const dist = Math.abs(frac - node.index);
        const boost = Math.max(0, 1 - dist * 0.6);
        node.mesh.rotation.y = t * 0.15 + node.index;
        node.mesh.rotation.x = t * 0.08;
        node.light.intensity = node.baseIntensity + boost * 1.6;
        node.mesh.material.emissiveIntensity = 0.5 + boost * 0.9;
      });

      const idx = Math.min(Math.floor(frac), n - 2 < 0 ? 0 : n - 2);
      const localFrac = frac - idx;
      const a = waypoints[idx], b = waypoints[Math.min(idx + 1, n - 1)];
      const basePos = new THREE.Vector3().lerpVectors(a, b, localFrac);
      camera.position.set(basePos.x * 0.45, basePos.y + 1.5, basePos.z + 6.5);
      camera.lookAt(basePos.x * 0.3, basePos.y + 1.0, basePos.z - 11);

      renderer.render(scene, camera);
    };
    animate();
  }

  onResize() {
    if (!this.three) return;
    const canvas = this.canvasRef.current;
    this.three.camera.aspect = canvas.clientWidth / canvas.clientHeight;
    this.three.camera.updateProjectionMatrix();
    this.three.renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
  }

  onScroll() {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const progress = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
    this.scrollProgress = progress;
    const n = this.sections.length;
    const frac = progress * (n - 1);
    const activeIndex = Math.round(frac);
    const dist = Math.abs(frac - activeIndex);
    const panelOpacity = Math.max(0.06, 1 - dist * 2.4);
    this.activeIndexInstance = activeIndex;
    if (activeIndex !== this.state.activeIndex || Math.abs(panelOpacity - this.state.panelOpacity) > 0.03) {
      this.setState({ activeIndex, panelOpacity });
    }
  }

  goTo(i) {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const n = this.sections.length;
    const target = (i / (n - 1)) * max;
    window.scrollTo({ top: target, behavior: 'smooth' });
  }

  renderVals() {
    const n = this.sections.length;
    const current = this.sections[this.state.activeIndex];
    const dots = this.sections.map((s, i) => {
      const active = i === this.state.activeIndex;
      return {
        label: s.navLabel,
        labelColor: active ? '#eafff6' : 'rgba(223,245,238,0.35)',
        dotColor: active ? '#5EEAD4' : 'rgba(140,242,155,0.35)',
        dotShadow: active ? '0 0 8px 2px rgba(94,234,212,0.7)' : 'none',
        go: () => this.goTo(i),
      };
    });
    return {
      canvasRef: this.canvasRef,
      scrollSpacerHeight: n * (typeof window !== 'undefined' ? window.innerHeight : 900),
      dots,
      current: { ...current, hasChips: current.chips && current.chips.length > 0, bottomMargin: current.chips && current.chips.length > 0 ? 26 : 6 },
      isHero: this.state.activeIndex === 0,
      isNotHero: this.state.activeIndex !== 0,
      panelOpacity: this.state.panelOpacity,
      panelTransform: `translateY(${(1 - this.state.panelOpacity) * 10}px)`,
    };
  }
}

</script>
</body>
</html>
